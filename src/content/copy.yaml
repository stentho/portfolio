      sections:
        - heading: ""
          paragraphs:
            - "Lääkintälaitealalla potilasturvallisuus on kaikki kaikessa. Asiakkaalla oli varhaisen vaiheen konsepti lääkinnällisestä laitteesta, jonka tueksi oli jo tehty alustavaa käyttäjätutkimusta ja käyttöliittymäkonseptointia."
            - "Liityin pieneen, suunnittelijoista ja ohjelmistokehittäjistä koostuvaan tiimiin, joka työskenteli tiiviissä yhteistyössä asiakkaan tuoteomistajan kanssa. Tavoitteenamme oli kehittää varhaisesta konseptista valmis, käyttäjälähtöinen ja käyttöturvallinen lääkinnällinen tuote, joka täyttää CE-merkinnän vaatimukset."
            - "Työ eteni kolmessa vaiheessa:"
        - heading: "1. Kontekstin ymmärtäminen ja tutkimustiedon täydentäminen"
          image:
            file: "medtech-context_light.svg"
            alt: ""
          paragraphs:
            - "Aloitimme perehtymällä aiempaan käyttäjätutkimukseen ja käyttöliittymäkonseptin luonnoksiin. Syvensin ymmärrystäni lääkäreiden työstä haastattelemalla useita kokeneita lääkäreitä. Tavoitteena oli lisätä ymmärrystä lääkäreiden arjen työskentelystä, sekä tilanteista, joihin liittyy merkittäviä potilasturvallisuusriskejä."
            - "Lisäksi rakensimme julkisiin tietolähteisiin perustuvan sisäisen LLM-työkalun sparrailukumppaniksi. Kaikki potilasturvallisuuteen ja suunnitteluratkaisujen kannalta kriittiset havainnot varmistimme aina lääketieteen asiantuntijoilta."
        - heading: "2. Suunnittelu ja arviointi"
          image:
            file: "medtech-design-testing_light.svg"
            alt: ""
          paragraphs:
            - "Osallistuin tiiviisti käyttöliittymän suunnitteluprosessiin ja suunnitteluratkaisujen arviointiin. Tunnistin suunnittelun edetessä mahdollisia käytettävyysongelmia ja nostin esiin erityisesti käyttöturvallisuuteen liittyviä riskejä."
            - "Lääkinnällisten laitteiden kehityksessä poikkeukselliset käyttötilanteet ja reunatapaukset ovat erityisen tärkeitä, sillä niissä pienilläkin käytettävyysongelmilla voi olla vakavia seurauksia potilasturvallisuudelle. Suunnittelimme siksi yhdessä kollegani kanssa testiskenaarioita, jotka perustuivat tunnistettuihin vaaroihin ja niihin liittyviin käyttötilanteisiin. Varmistimme skenaarioiden realistisuuden yhteistyössä lääkäreiden kanssa."
            - "Vastasin kaikista formatiivisista käytettävyystesteistä, joiden tavoitteena oli arvioida suunnitteluratkaisuja iteratiivisesti ja tunnistaa mahdolliset käyttövirheet jo kehityksen aikana. Testien avulla pystyimme arvioimaan aiemmin tunnistettuja käyttöturvallisuusriskejä sekä tunnistamaan uusia käyttövirheitä ja mahdollisia vaaratilanteita. Havaintojen perusteella kehitimme käyttöliittymää sujuvammaksi ja turvallisemmaksi."
            - "Työtä ohjasivat lääkinnällisten laitteiden riskienhallinnan ja käytettävyyssuunnittelun standardit ISO 14971, IEC 62366-1 ja IEC/TR 62366-2."
        - heading: "3. Summatiivinen arviointi"
          image:
            file: "medtech-evaluation_light.svg"
            alt: ""
          paragraphs:
            - "Johdin CE-merkintäprosessiin kuuluvaa summatiivista käytettävyysarviointia, jonka tavoitteena oli osoittaa, että kohderyhmien käyttäjät pystyvät käyttämään lääkinnällistä laitetta turvallisesti tarkoitetuissa käyttötilanteissa."
            - "Vastasin testauksen suunnittelusta ja toteutuksesta sekä moderoin henkilökohtaisesti kaikki testi-istunnot. Arviointiin osallistui yhteensä 30 käyttäjää eri kohderyhmistä. Kukin noin 2,5 tunnin istunto sisälsi tuotteen esittelyn, haastattelun, käytännön käyttötehtäviä ja loppuarvioinnin. Osallistujia oli useista eri maista."
        - heading: "Lopputulos"
          paragraphs:
          - "Summatiivinen käytettävyysarviointi täytti hyväksymiskriteerit ja tuki laitteen CE-merkinnän saavuttamista. Laite on nyt CE-merkitty."
    - title: "Teleoperaattori: 30+ projektia jatkuvan UX-konsultoinnin puitteissa"
      cover:
        file: "case-cover.svg"
        alt: ""
      intro:
        paragraphs:
          - "<strong>6 vuotta, 30+ projektia. Pitkän UX-konsultoinnin kuluessa olen päässyt vaikuttamaan monella tapaa asiakasymmärryksen kasvattamisesta tuotestrategiaan ja saavutettavuuden parantamiseen.</strong>"
          - "Jokaisessa projektissa sparraillaan ensin asiakkaan suunnittelijoiden ja tuoteomistajien kanssa projektin ja tavoitteiden rajaamisesta. Lopuksi vein konkreettiset suositukset suoraan päätöksentekijöiden pöydälle."
          - "Kolme nostoa vuosien varrelta:"
      subcases:
        - title: "1. Viihdeboksi: käyttööonoton kipukohdat kuntoon"
          teaser: "Havainnot ohjasivat satojentuhansien asiakkaan käyttöönottoprosessin uudistamisprosessia."
          cover:
            file: "setup-cover.svg"
            alt: ""
          sections:
            - heading: "Haaste"
              quote:
                text: "Olen erittäin tyytyväinen UX tutkimusprojektiin, jonka Thomas teki palvelustamme . . . Olen erityisen tyytyväinen siihen, että ehdotukset sisälsivät myös vaihtoehtoisia tapoja helpottaa asiakkaan kokemusta, jotta meillä olisi mahdollisuus tehdä monia parannuksia teknisistä rajoitteista huolimatta. Thomas halusi alusta asti ymmärtää tarkoin meidän ongelmakenttämme, sekä mihin tutkimuksella pyritään, ja projekti saavutti tavoitteensa erinomaisesti."
                name: "Asiakas"
                title: "liiketoimintakehittäjä"
                original_lang: "fi"
              image:
                file: "setup-challenge.svg"
                alt: ""
              paragraphs:
              - "Asiakastyytyväisyyskyselyissä toistui negatiivinen palaute viihdeboksin käyttöönottoprosessista. Haluttiin paremmin ymmärtää asiakkaiden haasteita korjaustoimenpiteiden priorisoinnin tueksi."
              - "Johdin tutkimus- ja UX-konsultointiprosessia, jossa rajattiin projektin laajuus ensin yhdessä asiakkaan liiketoimintakehittäjän kanssa."
            - heading: "Lähestymistapa ja havainnot"
              image:
                file: "setup-findings.svg"
                alt: ""
              paragraphs:
                - "Seurasin, kun kuusi kohderyhmän käyttäjää purkasi, asensi ja otti asiakkaan viihdeboksin käyttöön ensimmäistä kertaa. Testaus tehtiin oikealla laitteella ja televisiolla, jonka ansiosta löysimme aitoja kipukohtia, jotka olisivat jääneet prototyypillä huomaamatta."
                - "Havaintojen perusteella laadin parannusehdotuksia, ottaen huomioon asiakkaan liiketoimintatavoitteet ja tekniset rajoitteet:"
                - |
                  - <strong>Paristojen löytäminen ja asennus oli yllättävän hankalaa</strong> → Asennetaan paristot valmiiksi kaukosäätimeen.
                  - <strong>Ohjelmistoasennus tuntui pitkältä ja puuduttavalta</strong> → Virtaviivaistetaan käyttöönottoprosessia mahdollisuuksien mukaan, ja lisätään selkeät etenemisindikaattorit silloin kun se ei ole mahdollista.
                  - <strong>Useat eri hakutoiminnot hämmensivät käyttäjiä</strong> → Yksi yhtenäinen haku koko alustalle.
            - heading: "Vaikutus"
              image:
                file: "setup-impact.svg"
                alt: ""
              paragraphs:
               - "Esittelin tulokset tuotejohdolle, ja kävimme yhdessä läpi design-suositusten toteutuskelpoisuuden ja prioriteetit. Tiimi otti käyttöönottoprosessin uudistamisen työn alle; tarkemmat toteutustiedot ovat luottamuksellisia."
        - title: "2. Matkailu ja roaming: tuotestrategian uudelleenhahmottaminen"
          teaser: "Tutkimustulosten perusteella estettiin uuden tuotteen kehitys, joka olisi maksanut kymmeniä tuhansia euroja eikä olisi vastannut asiakkaiden tarpeisiin."
          cover:
            file: "roaming-cover.svg"
            alt: ""
          sections:
            - heading: "Haaste"
              quote:
                text: "Erityiskiitos Thomakselle, jonka osaaminen ja panostus roaming-tutkimusprosessiin on ollut merkittävä. Hän osasi kerätä kriittisen käyttäjäymmärryksen ja viestiä havainnoistaan tehokkaasti, mikä teki työhömme suuren vaikutuksen."
                name: "Asiakas"
                title: "Digital Experience Lead"
                original_lang: "en"
              image:
                file: "roaming-challenge.svg"
                alt: ""
              paragraphs:
              - "Asiakas halusi kasvattaa matkailijasegmenttiään ja lisätä melko vaisua roaming-tuotteiden käyttöä."
              - "Rajasin projektin laajuuden yhdessä asiakkaan digikokemusvastaajan kanssa: minä vastasin asiakasymmärryksen kasvattamisesta ja tuotestrategian tukemisesta."
            - heading: "Lähestymistapa ja havainnot"
              image:
                file: "roaming-findings.svg"
                alt: ""
              paragraphs:
              - "Tein kahdeksan syvähaastattelua aktiivimatkailijoiden kanssa. Tavoitteena oli saada monipuolisempi käsitys heidän tarpeistaan ja kokemuksistaan. Näytin haastattelun tueksi myös uusia roaming-tuotekonsepteja."
              - "Havaintojen perusteella laadin asiakkaan tuella konkreettiset toimintasuositukset:"
              - |
                - <strong>Roamingia välteltiin takavuosien kalliiden laskujen pelossa; moni turvautui hotellin WiFiin tai prepaid-liittymään</strong> → Nostetaan selvemmin esiin jo olemassa olevia matkadatapaketteja vaihtoehtona roamingiin, jolloin vältetään perinteisen käyttöperusteisen laskutuksen huono kaiku.
                - <strong>Tervetulotekstiviestit aiheuttivat hämmennystä ja datan tarvetta ei osattu arvioida</strong> → Avataan datamäärät konkreettisilla esimerkeillä ja helpotetaan kulutuksen seurantaa tekstiviesteillä.
                - <strong>Isompia datapaketteja suosittiin; käyttöperusteista laskutusta pidettiin vain hätävarana</strong> → Siirretään painopiste nykyvalikoimassa isompiin datapaketteihin. Vaikka niiden kulurakenne on hieman toisenlainen, asiakasarvo oli niissä selvemmin havaittavissa.
            - heading: "Vaikutus"
              image:
                file: "roaming-impact.svg"
                alt: ""
              paragraphs:
               - "Esittelin havainnot tuotejohdolle ja sparrasin tiimin kanssa parannustoimenpiteistä ja prioriteeteistä. Löydösten perusteella kaavailtua uutta tuotetta ei lähdetty rakentamaan, koska se ei olisi vastannut asiakkaan tarpeeseen, mikä säästi kymmeniä tuhansia euroja tuotekehityskuluissa. Sen sijaan painopiste suunnattiin olemassa olevien tuotteiden tietoisuuden lisäämiseen."
        - title: "3. Viestintäalustan saavutettavuuden parantaminen"
          teaser: "Valtaosa havaituista ongelmista oli korjattu vuotta myöhemmin tehdyssä saavutettavuuden tarkastavassa arvioinnissa."
          cover:
            file: "a11y-cover.svg"
            alt: ""
          sections:
            - heading: "Haaste"
              quote:
                text: "Hienoa työtä, Thomas . . . Hyviä havaintoja, hyviä yksityiskohtia, hyvin toteutettu."
                name: "Asiakas"
                title: "ohjelmistokehittäjä"
                original_lang: "en"
              image:
                file: "a11y-challenge.svg"
                alt: ""
              paragraphs:
              - "Asiakas halusi selvittää asiakasviestintäalustansa saavutettavuuden tilan, pitkälti nojaten lakisääteisiin vaatimuksiin. Johdin arviointiprosessia: rajattiin laajuus kehitystiimin kanssa ja ankkuroitiin arvioinnin kriteerit WCAG 2.2 -standardiin sekä EU:n esteettömyysdirektiivin vaatimuksiin."
            - heading: "Lähestymistapa ja havainnot"
              image:
                file: "a11y-findings.svg"
                alt: ""
              paragraphs:
              - "Arvioin palvelun Windows-tietokoneella, käyttäen mm. NVDA-ruudunlukuohjelmaa ja näppäimistönavigointia. Keskeiset havainnot:"
              - |
                - Liitetiedostoja ei pystynyt lisäämään pelkällä näppäimistöllä, ja joitakin muita toimintoja ei myöskään voinut käyttää apuvälinellä.
                - Kohdistusindikaattorit ja ohjelmalliset nimilaput puuttuivat monesta komponentista.
                - Kohdistusjärjestys oli paikoitellen sekava.
            - heading: "Vaikutus"
              image:
                file: "a11y-impact.svg"
                alt: ""
              paragraphs:
              - "Esittelin tulokset kehitystiimille ja tuoteomistajille. Pisteytin havainnot vakavuuden perusteella (1–4), ja tiimissä arvioitiin työmäärää korjaustoimenpiteille. Vuotta myöhemmin ehdotin seurantakierrosta, jolle asiakas näytti vihreää valoa – tällä kertaa testasin palvelua myös iOS-laitteella mm. VoiceOverin kanssa. Valtaosa aiemmin liputetuista ongelmista oli korjattu. Joitakin vanhoja puutteita oli yhä jäljellä ja uusiakin löytyi (osittain iOS-testauksen, aiempien ongelmien takaa paljastuneiden ongelmien sekä uusien ominaisuuksien myötä). Kokonaisuudessaan palvelun saavutettavuus oli kuitenkin parantunt merkittävästi."
      synthesis:
        heading: "Summa summarum"
        paragraphs:
          - "Teen tiivistä yhteistyötä tuote-, muotoilu-, kehitys- ja johtotiimien kanssa lisätäkseni asiakasymmärrystä, karsiakseni turhaa kitkaa ja tehdäkseni palveluista helppokäyttöisempiä ja saavutettavampia."
          - "Sama toimintamalli kantaa hyvinkin erilaisissa projekteissa:"
          - |
            - <strong>Rajataan projektin laajuus yhdessä asiakkaan kanssa.</strong> Jokaisen projektin tärkein vaihe on tavoitteiden ja tutkimuskysymysten määrittely sekä pohtiminen, miten tuloksia tullaan oikeasti hyödyntämään jatkossa.
            - <strong>Testataan realistisissa olosuhteissa.</strong> Todelliset skenaariot, oikeat kohderyhmän käyttäjät ja oikeat apuvälineet takaavat sen, että havainnot pätevät myös käytännössä.
            - <strong>Toteutuskelpoiset suositukset ja maaliin vieminen.</strong> Yhdistetään käyttäjäymmärrys ja UX-havainnot teknisiin ja liiketoiminnallisiin rajoitteihin, sovitaan prioriteeteista tiimien kanssa ja seurataan, että korjaukset toimivat myös käytännössä.


sv:
  lang_name: "Svenska"
  title: "Thomas Stenius – Senior UX- och tjänstedesigner"
  description: "Thomas Stenius portfolio. Senior UX- och tjänstedesigner samt användarforskare."
  skip_link: "Hoppa till huvudinnehållet"
  nav_label: "Språkval"
  name: "Thomas Stenius"
  role: "Senior UX- och tjänstedesigner"
  intro: 
    - "<strong>9 år, 100+ kundprojekt.</strong> Jag hjälper organisationer omvandla sina mål och användarbehov till klara och tydliga designriktningar."
    - "Jag är människocentrerad, flexibel i metodologi och praktiskt inriktad med tillgänglighet och LLM-verktyg."
  portrait_alt: "Porträtt av Thomas Stenius"
  testimonials_heading: "Vad kunder säger"
  translated_from:
    fi: "Översatt från finska"
    sv: "Översatt från svenska"
    en: "Översatt från engelska"
  testimonials:
    - text: "Vi har haft ett långvarigt samarbete, och har alltid varit nöjda med din professionalism och inställning till arbetet och kunden."
      name: "Kund"
      title: "försäkringsbolag"
      original_lang: "en"
    - text: "Ditt exceptionella arbete har verkligen överträffat våra förväntningar. De insikter du levererade har varit avgörande för att forma våra design- och affärsstrategier och gett oss en tydligare förståelse för våra kunder och deras behov."
      name: "Kund"
      title: "telekommunikationsföretag"
      original_lang: "en"
  about:
    heading: "\"Vem är du, Thomas?\""
    sections:
      - heading: "\"Hurdan designer är du?\""
        paragraphs:
          - "<strong>Vad jag gör:</strong> Hela processen från början till slut: research, koncept, design, utvärdering, få ihop intressenterna, tillgänglighetsgranskning. För den visuella finslipningen samarbetar jag gärna med visuella designers."
          - "<strong>Hur jag tänker:</strong> Mina designbeslut grundar sig på research. Det betyder inte att man går långsamt, utan att man <em>förstår vad man håller på med</em>:"
          - "<blockquote>Vilka är intressenterna?</blockquote>"
          - "<blockquote>Var går värdeflödena?</blockquote>" 
          - "<blockquote>Vilket värde skapar vi, och för vem?</blockquote>"
          - "<blockquote>Vilka konsekvenser, positiva och negativa, förverkligas om vi lanserar den här produkten?</blockquote>"
          - "<blockquote>Hur definierar vi – och mäter – framgång och misslyckande?</blockquote>"
          - "För att kunna svara på dessa frågor måste man prata med människor, observera dem och lyssna."
          - "<strong>Resultat, inte volym:</strong> I en värld där AI-verktyg gör det billigare och snabbare än någonsin att bygga mjukvara är det avgörande att vi inte bara skapar mera saker, utan värde. AI ger designers nya fina möjligheter att själva smutsa ner händerna, men verktyg är bara verktyg i slutändan. Jag använder de redskap som funkar: Claude Code, Figma, penna och papper. Fortfarande är det <em>klarhet</em> och <em>förståelse</em> som medför den största effekten."
      - heading: "\"Hur använder du AI?\""
        paragraphs:
          - "På många sätt! Här är tre:"
          - "<strong>Att vässa stålet:</strong> Chattbotar hjälper mig att vässa mina idéer. Jag ser det som en vidareutveckling av den s.k. \"gummiankmetoden\", där man reder ut sina tankar genom att förklara dem steg för steg till en leksaksanka. AI-chattbottar kan förstås dessutom svara tillbaka, hitta luckor i resonemanget och peka ut sådant man missat. Stål vässar stål."
          - "<strong>Djupsökning:</strong> Språkmodeller är fantastiska på att gräva sig igenom enorma datamängder och hitta sånt som traditionellt varit väldigt svårt att hitta. En tidsstämpel för ett citat ur 12 timmars intervjuinspelningar? Inga problem. En specifik fil från ett gammalt projekt? Även en vag prompt räcker."
          - "<strong>Funktionella prototyper och webbplatser:</strong> LLM:er är bra både på att skriva kod och på att förklara hur den fungerar. Som exempel har jag byggt den här nätsidan med hjälp av Claude. Jag skissade layouten för hand och definierade kraven, innehållet och tillgänglighetskriterierna (WCAG 2.2). Claude skapade baskoden och dekorationerna, som jag sedan granskade, redigerade och byggde vidare på. Därefter itererade jag antingen direkt i koden eller genom att be Claude om tips. Hela tiden hade jag koll på vad som hände, både i koden och i designen."
      - heading: "\"Okej, när använder du <em>inte</em> AI?\""
        paragraphs:
          - "<strong>Tankekrävande uppgifter:</strong> Komplex problemlösning, visionsarbete, konceptutveckling, wireframing, att avgöra vad som är viktigt. Jag tror att första utkastet till vad som helst alltid ska komma från en själv, hur skissartat det än är, för det är där ramarna sätts. Språkmodeller kan vara riktigt bra kritiker och bollplank, men det är jag som dirigerar orkestern. Det är definitivt inte så här:"
          - "<blockquote>Claude, generera ett fullt fungerande designsystem åt mig. Gör inga misstag.</blockquote>"
          - "Design är något avsiktligt, och generativa AI-modeller har ingen egen avsikt. De är kraftfulla (och ofta användbara) statistiska mönstermatchare som reagerar på prompter, men mer än så är de inte."
          - "<strong>När generativ AI är \"overkill\":</strong> Datorkraft är inte gratis, varken ekonomiskt eller miljömässigt. Om det finns ett mindre beräkningsintensivt sätt att göra något väljer jag i första hand det. För enkla uppgifter, som att sortera en tabell, är ett deterministiskt skript det klokare valet. Om jag behöver generativ AI men uppgiften inte är särskilt krävande tar jag en mindre modell."
          - "<strong>Tester i verkligheten:</strong> Att prova saker i verkligheten är det snabbaste sättet att få veta vad som faktiskt funkar. Den här webbplatsen testade jag till exempel med riktiga hjälpmedel (skärmläsare, enbart tangentbord, röststyrning) och kontrollerade den mot etablerade tillgänglighetskriterier (WCAG 2.2)."
      - heading: "\"Vad vill du göra framöver?\""
        paragraphs:
          - "Skapa <em>tekniskt fungerande</em>, <em>ekonomiskt vettiga</em> och <em>miljömässigt hållbara</em> produkter och tjänster som <em>förbättrar människors liv</em>."
          - "<em>Teknologi</em>, <em>business</em>, <em>planet</em> och <em>människor</em> – tar man bort någon av dem fungerar inte produkten, särskilt inte på lång sikt."

  work_heading: "Utvalda projekt"
  read_more: "Läs om projektet"
  subcase_more: "Läs om projektet"
  outcome_label: "Resultat"
  contact_heading: "Kontakta mig"
  contact_text: "Hör gärna av dig."
  contact_links:
    - label: "E-post"
      url: "mailto:thomasstenius@gmail.com"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/thomas-stenius"
  footer: "© 2026 Thomas Stenius"
  footer_note: "Byggd tillsammans med Claude Sonnet 5.5. Jag ansvarade för layout, krav, innehåll och tillgänglighetskriterier (WCAG 2.2); Claude genererade kod och illustrationer, som jag granskade och itererade. Byggd med Eleventy, YAML-innehållsfiler och ren HTML/CSS. Hostad på GitHub Pages."
  projects:
    - title: "Medicinteknisk produkt: från tidigt koncept till CE-märkt produkt"
      glance:
        - label: "Min roll"
          value: "Jag fungerade som senior UX-konsult i ett större team. Bl.a. ansvarade jag för användarforskningen samt den formativa och summativa användbarhetsutvärderingen av produkten som en del av CE-märkningsprocessen. Utifrån resultaten bidrog jag till att göra användargränssnittet mer användarcentrerat, lättare att använda och säkrare."
        - label: "Resultat"
          value: "En användarvänligare och säkrare produkt som bygger på forskning. Användbarheten är validerad och dokumenterad, och produkten är nu CE-märkt."
      cover:
        file: "medtech-cover.svg"
        alt: ""
      sections:
        - heading: ""
          paragraphs:
            - "Inom medicinteknik är patientsäkerhet allt. Kunden hade ett koncept för en medicinteknisk produkt i ett tidigt skede, med inledande användarforskning och konceptbilder som underlag."
            - "Jag gick med i ett litet team av designers och utvecklare som arbetade i nära samarbete med kundens produktägare. Vårt mål var att utveckla det tidiga konceptet till en färdig, användarcentrerad och säker medicinteknisk produkt som uppfyller kraven för CE-märkning."
            - "Vi arbetade i tre faser:"
        - heading: "1. Förstå sammanhanget, komplettera med forskning"
          image:
            file: "medtech-context_light.svg"
            alt: ""
          paragraphs:
            - "Vi började med att gå igenom den befintliga användarforskningen och konceptbilderna. Jag fördjupade min förståelse för läkares arbete genom att intervjua flera erfarna läkare om deras vardag och om situationer där patientsäkerheten är mest utsatt."
            - "Dessutom byggde vi ett internt LLM-verktyg baserat på offentliga källor som bollplank. Allt som var kritiskt för patientsäkerheten eller designlösningarna validerade vi alltid med medicinska experter."
        - heading: "2. Design och utvärdering"
          image:
            file: "medtech-design-testing_light.svg"
            alt: ""
          paragraphs:
            - "Jag var nära involverad i designprocessen och i utvärderingen av designlösningarna. Under arbetets gång identifierade jag möjliga användbarhetsproblem och lyfte särskilt fram risker som gällde patientsäkerhet."
            - "Inom medicinteknik är ovanliga användningssituationer och gränsfall särskilt viktiga, eftersom även små användbarhetsproblem kan ha allvarliga följder för patientsäkerheten. Tillsammans med en kollega utformade jag därför testscenarier som utgick från identifierade faror och relaterade användningssituationer. Vi arbetade med läkare för att säkerställa att scenarierna var realistiska."
            - "Jag genomförde all formativ användbarhetstestning, vars mål var att iterativt utvärdera designlösningarna och identifiera möjliga användningsfel redan under utvecklingen. Med hjälp av testerna bekräftade vi tidigare identifierade risker och upptäckte nya möjliga användningsfel och faror. Utifrån iakttagelserna gjorde vi gränssnittet smidigare och säkrare."
            - "Arbetet vägleddes av standarderna för riskhantering och användbarhet inom medicinteknik: ISO 14971, IEC 62366-1 och IEC/TR 62366-2."
        - heading: "3. Summativ utvärdering" 
          image:
            file: "medtech-evaluation_light.svg"
            alt: ""
          paragraphs:
            - "Jag ledde den summativa användbarhetsutvärderingen som ingår i CE-märkningsprocessen och vars mål var att visa att de avsedda användarna kan använda produkten säkert i de avsedda användningssituationerna."
            - "Jag ansvarade för planeringen och genomförandet av testningen och modererade alla sessioner personligen. Totalt 30 användare från de relevanta användargrupperna deltog i sessioner på 2,5 timmar (introduktion, intervju, praktisk testning och utvärdering). Deltagarna kom från flera olika länder."
        - heading: "Resultat"
          paragraphs:
          - "Den summativa användbarhetsutvärderingens acceptanskriterier uppfylldes, och utvärderingen stödde produktens CE-märkning. Produkten är nu CE-märkt."
    - title: "Teleoperatör: långt UX-partnerskap och över 30 projekt"
      cover:
        file: "case-cover.svg"
        alt: ""
      intro:
        paragraphs:
          - "<strong>Under sex år och 30+ projekt har jag stöttat beslut kring produktutveckling, design, tillgänglighet och regelefterlevnad för att förbättra kundupplevelsen.</strong>"
          - "Varje projekt inleddes i tätt samarbete med kundens designers och produktfolk för att ringa in undersökningens omfattning och strategi – och avslutades med att vi lade konkreta rekommendationer på beslutsfattarnas bord."
          - "Här är tre exempel som visar bredden i mitt arbete:"
      subcases:
        - title: "1. TV-box: att fixa en frustrerande första upplevelse"
          teaser: "Insikterna lade grunden för att förnya installationsprocessen för hundratusentals kunder."
          cover:
            file: "setup-cover.svg"
            alt: ""
          sections:
            - heading: "Utmaning"
              quote:
                text: "Jag är väldigt nöjd med UX-undersökningen som Thomas gjorde om vår tjänst . . . Jag är särskilt nöjd med att rekommendationerna också beaktade alternativa sätt att förbättra kundupplevelsen, så att vi kunde implementera så många förbättringar som möjligt trots tekniska begränsningar. Från början till slut ville Thomas förstå vårt problemutrymme och forskningens mål, och projektet uppfyllde sina mål utmärkt."
                name: "Kund"
                title: "Business Development Manager"
                original_lang: "fi"
              image:
                file: "setup-challenge.svg"
                alt: ""
              paragraphs:
              - "I kundenkäterna kom det fram återkommande kritik mot hur det kändes att packa upp och installera kundens TV-box. Kunden ville undersöka vad som låg bakom friktionen för att kunna prioritera rätt i vidareutvecklingen. Jag ledde undersökningen och formulerade designrekommendationerna i samarbete med kundens designers och affärsutvecklare."
            - heading: "Metod och insikter"
              image:
                file: "setup-findings.svg"
                alt: ""
              paragraphs:
                - "Jag observerade sex personer ur målgruppen när de packade upp och installerade en riktig produktionsbox kopplad till en vanlig tv. Det lyfte fram konkreta problem som en prototyp aldrig hade avslöjat. Helheten fungerade i stort sett okej, men varje enskilt problem mynnade ut i en rekommendation anpassad efter kundens tekniska ramar:"
                - |
                  - <strong>Batterierna var svåra att hitta och sätta i</strong> → Fjärrkontrollen borde levereras med batterierna förinstallerade från fabriken.
                  - <strong>Mjukvaruinstallationen kändes lång och tröttsam</strong> → Processen bör förenklas där det går, och tydliga förloppsindikatorer lades till i de steg som inte kunde kortas ner.
                  - <strong>Flera separata sökfunktioner var förvirrande</strong> → All sökning borde samlas i en och samma funktion i hela gränssnittet.
            - heading: "Resultat"
              image:
                file: "setup-impact.svg"
                alt: ""
              paragraphs:
               - "Jag presenterade resultaten för produktledningen och gick igenom genomförbarhet och prioriteringar tillsammans med teamen. Teamet tog fram en plan för att göra om hela installationsprocessen, med smarta kompromisser kring tekniska begränsningar. Detaljerna kring själva genomförandet är konfidentiella."
        - title: "2. Resor och roaming: en kursändring i produktbeslutet"
          teaser: "Undersökningen satte stopp för en produkt som inte svarade mot kundernas behov – och sparade tiotusentals euro."
          cover:
            file: "roaming-cover.svg"
            alt: ""
          sections:
            - heading: "Utmaning"
              quote:
                text: "Ett stort tack till Thomas, vars sakkunnighet och engagemang i roaming-undersökningen har varit exceptionellt. Hans förmåga att avslöja kritiska användarinsikter och kommunicera dem effektivt har gjort en betydande inverkan på vårt arbete."
                name: "Kund"
                title: "Digital Experience Lead"
                original_lang: "en"
              image:
                file: "roaming-challenge.svg"
                alt: ""
              paragraphs:
              - "Kunden ville växa inom resesegmentet och få fart på den låga användningen av sina roamingtjänster. Jag ansvarade för kundinsikterna och avgränsade uppdraget tillsammans med ledaren för digital upplevelse."
            - heading: "Metod och insikter"
              image:
                file: "roaming-findings.svg"
                alt: ""
              paragraphs:
              - "Jag gjorde djupintervjuer med åtta vana resenärer och testade nya roamingkoncept med dem. Varje insikt ledde till en konkret rekommendation:"
              - |
                - <strong>Resenärer undvek roaming p.g.a. rädsla för skyhöga räkningar som förr i tiden, och valde hellre WiFi eller lokala prepaid-kort</strong> → Lyft hellre fram befintliga datapaket för resor som ett tydligt och tryggt alternativ, i stället för att driva rörlig taxa som har en negativ klang hos kunderna.
                - <strong>Välkomst-sms:et var svårt att tyda och folk visste inte hur mycket data de behövde</strong> → Förklara datamängder med praktiska exempel och gör det enkelt att hålla koll på förbrukningen via sms.
                - <strong>Resenärerna föredrog större datapaket; löpande debitering sågs bara som en nödlösning</strong> → Fokusera på de större paketen i det befintliga utbudet. De har visserligen en annan kostnads- och marginalprofil, men kundnyttan och förtroendet väger upp skillnaden.
            - heading: "Resultat"
              image:
                file: "roaming-impact.svg"
                alt: ""
              paragraphs:
               - "Jag presenterade slutsatserna för produktledningen och sparrade prioriteringarna med teamet. Tack vare insikterna lades planerna på den tilltänkta nya produkten ner helt eftersom den inte mötte kundernas behov, vilket sparade tiotusentals euro i utvecklingskostnader. Resurserna lades i stället på att göra befintliga lösningar mer kända och attraktiva."
        - title: "3. Förbättringar i tillgängligheten för kommunikationsplattform"
          teaser: "En uppföljande granskning ett år senare visade att största delen av bristerna hade åtgärdats."
          cover:
            file: "a11y-cover.svg"
            alt: ""
          sections:
            - heading: "Utmaning"
              quote:
                text: "Mycket bra jobbat, Thomas . . . Bra upptäckter, bra detaljer, väl genomfört."
                name: "Kund"
                title: "systemutvecklare hos kunden"
                original_lang: "en"
              image:
                file: "a11y-challenge.svg"
                alt: ""
              paragraphs:
              - "Kunden behövde få koll på tillgängligheten i sin plattform för kundkommunikation, främst för att möta lagstadgade krav. Jag ledde granskningen, avgränsade upplägget ihop med utvecklingsteamet och bedömde tjänsten utifrån WCAG 2.2 och EU:s tillgänglighetsdirektiv."
            - heading: "Metod och insikter"
              image:
                file: "a11y-findings.svg"
                alt: ""
              paragraphs:
              - "Jag utvärderade tjänsten på en Windows-laptop med skärmläsaren NVDA och enbart tangentbordsnavigering. Några av de centrala problemen:"
              - |
                - Filer gick inte att bifoga med enbart tangentbord, och vissa andra funktioner var helt onåbara.
                - Tydliga fokusmarkeringar saknades och många komponenter saknade programmatiska etiketter.
                - Fokusordningen var ibland ologisk.
            - heading: "Resultat"
              image:
                file: "a11y-impact.svg"
                alt: ""
              paragraphs:
              - "Jag presenterade resultaten för produktägarna och utvecklingsteamet, och vi prioriterade åtgärderna utifrån svårighetsgrad (skala 1–4) och beräknad arbetsinsats. Ett år senare föreslog jag en uppföljning som kunden gav grönt ljus för – och den här gången testade jag även på iOS med VoiceOver. Största delen av de tidigare flaggade problemen hade åtgärdats. Vissa fanns kvar och en del nya hade tillkommit (dels via iOS-täckningen, dels genom nya funktioner och hinder som tidigare dolts bakom andra fel). Plattformens övergripande tillgänglighet hade ändå tagit ett rejält kliv framåt."
      synthesis:
        heading: "Summa summarum"
        paragraphs:
          - "Jag jobbar tätt ihop med produkt-, design-, utvecklings- och ledningsteam för att förstå kundernas vardag, skala bort onödig friktion och göra tjänster mer användbara och tillgängliga."
          - "Samma strategi fungerar i väldigt olika projekt:"
          - |
            - <strong>Gemensam avgränsning i workshop med kunden.</strong> Det viktigaste i varje projekt är att formulera skarpa mål och undersökningsfrågor, och säkerställa hur resultaten faktiskt ska användas i praktiken.
            - <strong>Testning under realistiska förhållanden.</strong> Äkta scenarier, verkliga användare ur målgruppen och faktiska hjälpmedel – så att insikterna håller när de möter verkligheten.
            - <strong>Genomförbara rekommendationer och uppföljning.</strong> Jag väger alltid användarbehov mot tekniska och affärsmässiga ramar, enas om prioriteringar med teamen och stämmer av att förbättringarna verkligen biter – precis som vid den uppföljande tillgänglighetsgranskningen.
