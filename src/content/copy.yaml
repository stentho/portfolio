# Keep the same keys in every language.
#
# To add a second project later: copy the whole "- title: ..." entry under
# "projects:" (in every language) and edit it.

en:
  lang_name: "English"
  title: "Thomas Stenius – Senior UX & Service Designer"
  description: "Portfolio of Thomas Stenius, a senior UX and service designer and user researcher."
  skip_link: "Skip to main content"
  nav_label: "Language"
  name: "Thomas Stenius"
  role: "Senior UX & Service Designer"
  intro: 
    - "<strong>9 years, 100+ client projects.</strong> Helping organizations turn business goals and user needs into clear design decisions."
    - "People-centered, method-flexible, and hands-on with accessibility and LLM tools*."
  portrait_alt: "Portrait of Thomas Stenius"
  testimonials_heading: "What clients say"
  translated_from:
    fi: "Translated from Finnish"
    sv: "Translated from Swedish"
    en: "Translated from English"
  # Quotes about you overall. original_lang = the language the person said it in.
  testimonials:
    - text: "We’ve had a longer co-operation and have always been satisfied with your professionalism and attitude towards work and your clients."
      name: "Client"
      title: "insurance company"
      original_lang: "en"
    - text: "Your exceptional work has truly exceeded our expectations. The insights you delivered have been instrumental in shaping our design and business strategies, providing us with a clearer understanding of our customers and their needs."
      name: "Client"
      title: "telecommunications company"
      original_lang: "en"
  about:
    heading: "About me"
    sections:
      - heading: "\"What kind of designer are you?\""
        paragraphs:
          - "<strong>What I do:</strong> End-to-end: research, concept, design, evaluation, stakeholder alignment, accessibility review. For visual polish, I like to partner with visual designers."
          - "<strong>How I think:</strong> I base my design decisions on research. That doesn't mean going slow, it means <em>understanding</em> what you're doing: "
          - "<blockquote>Who are the stakeholders?</blockquote>"
          - "<blockquote>What are the value streams?</blockquote>" 
          - "<blockquote>What value are we creating, and for whom?</blockquote>"
          - "<blockquote>What are the consequences, positive and negative, of releasing this product?</blockquote>"
          - "<blockquote>How do we define — and then measure — success or failure?</blockquote>"
          - "To answer these questions, you have to get out there and talk to, observe, and listen to people."
          - "<strong>Outcomes, not outputs:</strong> In a world where AI tools make it cheaper and faster than ever to build software, it's vital that we not just create stuff, but <em>value</em>. AI offers new possibilities for designers to go hands-on, but one core idea remains the same: tools are secondary. I'll use whatever works: Claude Code, Figma, pen & paper. No matter the tools, the true force multipliers are still <em>understanding</em> and <em>clarity</em>."
      - heading: "\"How do you use AI?\""
        paragraphs:
          - "Lots of ways! Here's three:"
          - "<strong>Sharpening steel:</strong> Helps refine my ideas. I like to think of it like an evolution of the \"rubber duck\" concept, where you organize your thoughts by explaining them step-by-step to an inanimate duck. AI chatbots, of course, can respond, poking holes in your arguments and highlighting potential things you've missed. Steel sharpens steel."
          - "<strong>Deep search:</strong> Language models are great at diving through huge piles of data to find the stuff that traditional search has trouble with. A timestamp for a quote from 12 hours of interview recordings? No problem. A specific file from an old project? Even a vague prompt is enough."
          - "<strong>Functional prototypes and websites:</strong> LLMs are great at both generating code and explaining how it works. For instance, this website was built with the help of Claude. I hand-sketched the layout and defined the requirements, content, and accessibility criteria (WCAG 2.2); Claude generated the base code and decorative elements, which I reviewed, edited, and expanded upon. From then on, I would iterate either by editing the code directly or asking Claude to step in. The whole time I stayed on top of what was happening both in the code and the design."
      - heading: "\"Okay, when do you <em>not</em> use AI?\""
        paragraphs:
          - "<strong>Thought-heavy tasks:</strong> Complex problem-solving, vision work, concepting, wireframing, deciding what's important. I believe the first draft of anything should always be your own, no matter how rough, as that's where essential framing happens. Language models can be very helpful critics and sparring partners, but I'm the one conducting the orchestra. It's certainly <em>not</em> this:"
          - "<blockquote>Claude, generate me a fully functional design system. Make no mistakes.</blockquote>"
          - "Design is intentional, and generative AI models have no intention of their own. They’re powerful (and often useful) statistical pattern-matchers that respond to prompts, but that's all they are."
          - "<strong>When generative AI is overkill:</strong> Compute is not cheap, financially or environmentally. If there is a less computationally intensive way of doing something, I consider that first. For simple tasks like sorting a spreadsheet, a deterministic script is the wiser choice. If I need generative AI but the task isn't super involved, I reach for a smaller model."
          - "<strong>Real-world testing:</strong> Trying something in the real world is the fastest way to know what actually works. For instance, I tested this site with real assistive technologies (screen readers, keyboard-only, voice-activation), checking against established accessibility criteria (WCAG 2.2)."
      - heading: "\"Going forward, what do you want to do?\""
        paragraphs:
          - "Make <em>technically sound</em>, <em>financially viable</em>, and <em>environmentally sustainable</em> products and services that <em>improve people's lives</em>."
          - "<em>Tech</em>, <em>biz</em>, <em>planet</em>, and <em>people</em> — remove any aspect and the product won't work, especially long-term."
  work_heading: "Selected work"
  read_more: "Read the case study"
  outcome_label: "Outcome"
  contact_heading: "Contact me"
  contact_text: "I'd love to hear from you."
  contact_links:
    - label: "Email"
      url: "mailto:thomasstenius@gmail.com"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/thomas-stenius"
  footer: "© 2026 Thomas Stenius"
  footer_note: "*Co-developed with Claude Sonnet 5.5. I led the layout, requirements, content, and accessibility criteria (WCAG 2.2); Claude generated code and illustrations, which I reviewed and iterated on. Built with Eleventy, YAML content files and plain HTML/CSS, hosted on GitHub Pages."
  projects:
    - title: "Medical device: from early concept to CE-marked product"
      # "At a glance": three short lines shown under the title
      glance:
        - label: "My role"
          value: "I was a senior UX consultant part of a larger team. Among other responsibilities, I led the user research and formative and summative usability evaluation of the device as part of the CE marking process. Based on the findings, I helped make the UI more user-friendly and safer to use."
        - label: "Outcome"
          value: "A user-friendlier, safer device backed by research; documented usability validation for CE marking; device CE marked."
      # Any number of sections, each with a heading and one or more paragraphs
      cover:
        file: "medtech-cover.svg"
        alt: ""
      sections:
        - heading: ""
          paragraphs:
            - "In medtech, patient safety is everything. A client had an early-stage device concept, backed by initial user research and mockups from earlier work."
            - "I joined a small team of designers and developers working closely with the client’s product owner. Our goal was to turn the early concept into a finished, user-centered and safe-to-use medical product that meets CE marking requirements."
            - "We worked in three phases:"
        - heading: "1. Understand the context, fill the research gaps"
          image:
            file: "medtech-context_light.svg"
            alt: ""
          paragraphs:
            - "We started by reviewing the existing user research and mockups. To deepen my understanding of physicians’ work, I interviewed several experienced doctors about their daily practice and the situations where patient safety is most at risk."
            - "To supplement this, we built an internal LLM-based tool from public sources as a sounding board. Any findings critical to patient safety or design decisions were always validated with medical experts."
        - heading: "2. Design and evaluate"
          image:
            file: "medtech-design-testing_light.svg"
            alt: ""
          paragraphs:
            - "I was closely involved in the user interface design process and in evaluating design solutions. As the design evolved, I identified potential usability issues and raised, in particular, those related to safe use."
            - "In medtech, unusual use situations and edge cases matter a lot, because even small usability problems can have serious consequences for patient safety. So, with a colleague, I designed test scenarios based on identified hazards and the related use situations, and worked with physicians to ensure they were realistic."
            - "I ran all the formative testing: iterative user tests to evaluate the designs and identify possible use errors in the development stage. These tests confirmed previously found risks and identified new hazards. Based on the findings we made, design changes to improve usability and use safety."
            - "The work was guided by medical device risk management and usability standards ISO 14971, IEC 62366-1 and IEC/TR 62366-2."
        - heading: "3. Summative evaluation"
          image:
            file: "medtech-evaluation_light.svg"
            alt: ""
          paragraphs:
            - "I led the summative usability evaluation required for CE marking: the final test showing that the device can be used safely by its intended users."
            - "I was closely involved in the planning of the tests and moderated each session personally. A total of 30 target users across the relevant user groups took part in 2.5-hour sessions (briefing, interview, hands-on testing and evaluation). Participants came from many different countries."
        - heading: "Outcome"
          paragraphs:
          - "The summative evaluation passed its acceptance criteria, supporting the CE-marking of the device. The product is now CE marked."

fi:
  lang_name: "Suomi"
  title: "Thomas Stenius – Johtava UX- ja palvelumuotoilija"
  description: "Thomas Steniuksen portfolio. Johtava UX- ja palvelumuotoilija."
  skip_link: "Siirry pääsisältöön"
  nav_label: "Kielivalinta"
  name: "Thomas Stenius"
  role: "Johtava UX- ja palvelumuotoilija"
  intro: 
    - "<strong>9 vuotta, 100+ asiakasprojektia.</strong> Autan organisaatioita yhdistämään liiketoiminnan tavoitteet ja käyttäjien tarpeet toimiviksi, käyttäjälähtöisiksi palveluiksi ja ratkaisuiksi."
    - "Olen ihmiskeskeinen ja menetelmiltäni joustava - lähestymistapani käyttäjäkokemukseen, saavutettavuuteen sekä LLM-työkaluihin* on käytännönläheinen."
  portrait_alt: "Etunimi Sukunimen muotokuva"
  testimonials_heading: "Mitä asiakkaat sanovat"
  translated_from:
    fi: "Käännetty suomesta"
    sv: "Käännetty ruotsista"
    en: "Käännetty englannista"
  testimonials:
    - text: "Olemme tehneet pitkään yhteistyötä ja olleet aina tyytyväisiä ammattitaitoonne ja asenteeseenne työtä ja asiakkaita kohtaan."
      name: "Asiakas"
      title: "vakuutusyhtiö"
      original_lang: "en"
    - text: "Poikkeuksellinen työpanoksesi todellakin ylitti odotuksemme. Esittämäsi havainnot ovat keskeisesti vaikuttaneet suunnittelu- ja liiketoimintastrategioihimme lisäten ymmärrystämme asiakkaistamme ja heidän tarpeistaan."
      name: "Asiakas"
      title: "telekommunikaatioyritys"
      original_lang: "en"
  about:
    heading: "Kuka minä olen"
    sections:
      - heading: "\"Minkälainen suunnittelija olet?\""
        paragraphs:
          - "<strong>Mitä teen:</strong> Suunnitteluprosessin joka vaihe: tutkimus, konseptointi, suunnittelu, arviointi, sidosryhmien valjastaminen, saavutettavuustarkastukset. Ulkoasun viimeistelyn teen mielelläni yhteistyössä visuaalisen suunnittelijan kanssa."
          - "<strong>Miten ajattelen:</strong> Ankkuroin suunnittelupäätökseni tutkimukseen. Se ei tarkoita, että edetään hitaasti, vaan että suunnittelu pohjautuu <em>ymmärrykseen siitä, mitä ollaan tekemässä</em>:"
          - "<blockquote>Keitä sidosryhmät ovat?</blockquote>"
          - "<blockquote>Miten arvovirrat liikkuvat?</blockquote>"
          - "<blockquote>Mitä arvoa luomme ja kenelle?</blockquote>"
          - "<blockquote>Mitä seurauksia tuotteen julkaisemisella on, hyviä ja huonoja?</blockquote>"
          - "<blockquote>Miten määrittelemme onnistumisen tai epäonnistumisen, ja miten niitä mitataan?</blockquote>"
          - "Vain puhumalla ihmisten kanssa, havainnoimalla heidän käyttäytymistään ja kuuntelemalla heitä voidaan näihin kysymyksiin vastata."
          - "<strong>Vaikutus, ei tuotos:</strong> Tekoälytyökalut ovat tehneet ohjelmistojen rakentamisesta halvempaa ja nopeampaa kuin koskaan ennen. Nyt on siis olennaista, ettei vain luoda tavaraa vaan <em>arvoa</em>. Tekoäly tuo suunnittelijoille uusia mahdollisuuksia laittaa kädet saveen, mutta yksi perusajatus pysyy samana: työkalut ovat vain työkaluja. Käytän sitä, mikä toimii: Claude Codea, Figmaa, kynää ja paperia. Aito tehokkuus syntyy silti <em>selkeydestä</em> ja <em>ymmärryksestä</em>."
      - heading: "\"Miten käytät tekoälyä?\""
        paragraphs:
          - "Monella tapaa! Tässä kolme:"
          - "<strong>Ajatusten terävöittäminen:</strong> Tekoälybotit ovat hyvä alusta ajatusten terävöittämiseen. Miellän ne seuraavaksi askeleeksi klassisesta \"kumiankkamenetelmästä\": Ajatukset järjestyvät, kun ne selittää auki vaihe kerrallaan elottomalle ankalle. Chatbotit voivat tietysti myös vastata (toisin kuin kumiankat), ja samalla löytää aukkoja argumenteissa ja muistuttaa asioista, jotka ovat voineet jäädä huomaamatta. Teräs hioo terästä."
          - "<strong>Semanttinen haku:</strong> Kielimallit ovat loistavia kahlaamaan valtavien aineistomassojen läpi ja löytämään sen, mihin perinteinen haku ei yllä. Aikaleima lainaukselle 12 tunnin haastattelutallenteista? Onnistuu hetkessä. Pitää etsiä jokin tietty tiedosto vanhasta projektista? Epämääräinenkin prompti riittää tekoälylle."
          - "<strong>Toiminnalliset prototyypit ja verkkosivut:</strong> Kielimallit ovat loistavia sekä koodin tuottamisessa että sen auki selittämisessä. Esimerkkinä tämä sivusto on yhdessä Clauden kanssa. Hahmottelin ensin osiot piirtämällä asettelun käsin. Määrittelin vaatimukset, sisällön ja saavutettavuuskriteerit (WCAG 2.2). Claude tuotti pohjakoodin ja koristeelementit, jotka kävin läpi, muokkasin ja täydensin. Sitten iteroin sivustoa joko muokkaamalla suoraan koodia tai pyytämällä Claudea apuun. Koko ajan pysyin kärryillä siitä, mitä tapahtui sekä koodissa että käyttöliittymässä."
      - heading: "\"Okei, entä mihin <em>et</em> käytä tekoälyä?\""
        paragraphs:
          - "<strong>Ajattelua vaativat tehtävät:</strong> Monimutkaiset ongelmat, visionti, konseptointi, rautalankamallit. Päätöksenteko siitä, mikä on tärkeää. Ajattelen, että ensimmäinen luonnos pitää aina olla itse tehty, vaikka se olisi kuinka raakile, koska juuri siinä tapahtuu suunnittelun kannalta olennainen asia: kehystys. Kielimallit ovat hyviä kriitikoita ja sparrauskumppaneita, mutta pidän itse vahvasti ohjat omissa käsissäni. Se ei todellakaan näytä tältä:"
          - "<blockquote>Claude, generoi minulle täysin toimiva design system. Älä tee virheitä.</blockquote>"
          - "Suunnittelu on tahallista toimintaa, ja generatiivisilla tekoälymalleilla ei ole omaa tahtoa. Ne ovat kyllä tehokkaita (ja usein hyödyllisiä) tilastollisia hahmontunnistajia, jotka vastaavat promptiin, mutta siihen ne rajoittuvat."
          - "<strong>Kun pienempi tykki riittää:</strong> Laskentateho ei ole ilmaista, ei rahassa eikä ympäristön kannalta. Jos asian voi tehdä vähemmän laskentaa vaativalla tavalla, harkitsen sitä ensin. Yksinkertaisissa tehtävissä, kuten taulukon lajittelussa, deterministinen skripti on viisaampi valinta. Jos kuitenkin tarvitsen generatiivista tekoälyä, mutta tarve ei ole erityisen monimutkainen, tartun suosiolla pienempään malliin."
          - "<strong>Oikean maailman testaus:</strong> Oikean maailman testaus on nopein tapa saada selville, mikä oikeasti toimii. Esimerkkinä testasin tämän sivuston oikeilla apuvälineillä (mm. ruudunlukijoilla, pelkällä näppäimistöllä ja puheohjauksella) saavutettavuuskriteerejä (WCAG 2.2) vasten."
      - heading: "\"Mitä haluat jatkossa tehdä?\""
        paragraphs:
          - "Rakentaa <em>teknisesti järkeviä</em>, <em>taloudellisesti kannattavia</em> ja <em>ympäristön kannalta kestäviä</em> tuotteita ja palveluita, jotka <em>parantavat ihmisten elämää</em>."
          - "<em>Teknologia</em>, <em>bisnes</em>, <em>planeetta</em> ja <em>ihmiset</em> — ota yksikin pois, niin tuote lakkaa toimimasta, ainakin pitkällä tähtäimellä."

  work_heading: "Valittuja projekteja"
  read_more: "Lue projektin kuvaus"
  outcome_label: "Lopputulos"
  contact_heading: "Ota yhteyttä"
  contact_text: "Vastaan mielelläni kysymyksiin."
  contact_links:
    - label: "Sähköposti"
      url: "mailto:thomasstenius@gmail.com"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/thomas-stenius"
  footer: "© 2026 Thomas Stenius"
  footer_note: "*Sivusto on rakennettu yhdessä Claude Sonnet 5.5-tekoälyavustajan kanssa. Vastasin ulkoasusta, vaatimuksista, sisällöstä ja saavutettavuuskriteereistä (WCAG 2.2); Claude tuotti koodin ja kuvitukset, jotka tarkistin ja iteroin. Sivusto on tehty Eleventyllä, YAML-sisältötiedostoilla sekä pelkällä HTML:llä ja CSS:llä, ja sijaitsee GitHub Pagesissa."
  projects:
    - title: "Lääkinnällinen laite: varhaisesta konseptista CE-merkittyyn tuotteeseen"
      glance:
        - label: "Roolini"
          value: "Toimin johtavana UX-konsulttina osana laajempaa tiimiä. Vastasin mm. käyttäjätutkimuksista ja lääkinnällisen laitteen formatiivisesta ja summatiivisesta käytettävyysarvioinnista osana CE-merkintäprosessia. Tulosten pohjalta kehitin käyttöliittymää käyttäjälähtöisemmäksi, helppokäyttöisemmäksi ja turvallisemmaksi."
        - label: "Lopputulos"
          value: "Tutkimukseen perustuva, käyttäjälähtöisempi ja käyttöturvallisempi tuote. Dokumentoitu näyttö käytettävyyden validoinnista CE-merkintäprosessissa. Tuote on saanut CE-merkinnän."
      cover:
        file: "medtech-cover.svg"
        alt: ""
      sections:
        - heading: ""
          paragraphs:
            - "Lääkintälaitealalla potilasturvallisuus on kaikki kaikessa. Asiakkaalla oli varhaisen vaiheen konsepti lääkinnällisestä laitteesta, jonka tueksi oli jo tehty alustavaa käyttäjätutkimusta ja käyttöliittymäkonseptointia."
            - "Liityin pieneen, suunnittelijoista ja ohjelmistokehittäjistä koostuvaan tiimiin, joka työskenteli tiiviissä yhteistyössä asiakkaan tuoteomistajan kanssa. Tavoitteenamme oli kehittää varhaisesta konseptista valmis, käyttäjälähtöinen ja käyttöturvallinen lääkinnällinen tuote, joka täyttää CE-merkinnän vaatimukset."
            - "Työ eteni kolmessa vaiheessa:"
        - heading: "1. Kontekstin ymmärtäminen ja tutkimustiedon täydentäminen"
          image:
            file: "medtech-context_light.svg"
            alt: ""
          paragraphs:
            - "Aloitimme perehtymällä aiempaan käyttäjätutkimukseen ja käyttöliittymäkonseptin luonnoksiin. Syvensin ymmärrystäni lääkäreiden työstä haastattelemalla useita kokeneita lääkäreitä. Tavoitteena oli lisätä ymmärrystä lääkäreiden arjen työskentelystä, sekä tilanteista, joihin liittyy merkittäviä potilasturvallisuusriskejä."
            - "Lisäksi rakensimme julkisiin tietolähteisiin perustuvan sisäisen LLM-työkalun sparrailukumppaniksi. Kaikki potilasturvallisuuteen ja suunnitteluratkaisujen kannalta kriittiset havainnot varmistimme aina lääketieteen asiantuntijoilta."
        - heading: "2. Suunnittelu ja arviointi"
          image:
            file: "medtech-design-testing_light.svg"
            alt: ""
          paragraphs:
            - "Osallistuin tiiviisti käyttöliittymän suunnitteluprosessiin ja suunnitteluratkaisujen arviointiin. Tunnistin suunnittelun edetessä mahdollisia käytettävyysongelmia ja nostin esiin erityisesti käyttöturvallisuuteen liittyviä riskejä."
            - "Lääkinnällisten laitteiden kehityksessä poikkeukselliset käyttötilanteet ja reunatapaukset ovat erityisen tärkeitä, sillä niissä pienilläkin käytettävyysongelmilla voi olla vakavia seurauksia potilasturvallisuudelle. Suunnittelimme siksi yhdessä kollegani kanssa testiskenaarioita, jotka perustuivat tunnistettuihin vaaroihin ja niihin liittyviin käyttötilanteisiin. Varmistimme skenaarioiden realistisuuden yhteistyössä lääkäreiden kanssa."
            - "Vastasin kaikista formatiivisista käytettävyystesteistä, joiden tavoitteena oli arvioida suunnitteluratkaisuja iteratiivisesti ja tunnistaa mahdolliset käyttövirheet jo kehityksen aikana. Testien avulla pystyimme arvioimaan aiemmin tunnistettuja käyttöturvallisuusriskejä sekä tunnistamaan uusia käyttövirheitä ja mahdollisia vaaratilanteita. Havaintojen perusteella kehitimme käyttöliittymää sujuvammaksi ja turvallisemmaksi."
            - "Työtä ohjasivat lääkinnällisten laitteiden riskienhallinnan ja käytettävyyssuunnittelun standardit ISO 14971, IEC 62366-1 ja IEC/TR 62366-2."
        - heading: "3. Summatiivinen arviointi"
          image:
            file: "medtech-evaluation_light.svg"
            alt: ""
          paragraphs:
            - "Johdin CE-merkintäprosessiin kuuluvaa summatiivista käytettävyysarviointia, jonka tavoitteena oli osoittaa, että kohderyhmien käyttäjät pystyvät käyttämään lääkinnällistä laitetta turvallisesti tarkoitetuissa käyttötilanteissa."
            - "Vastasin testauksen suunnittelusta ja toteutuksesta sekä moderoin henkilökohtaisesti kaikki testi-istunnot. Arviointiin osallistui yhteensä 30 käyttäjää eri kohderyhmistä. Kukin noin 2,5 tunnin istunto sisälsi tuotteen esittelyn, haastattelun, käytännön käyttötehtäviä ja loppuarvioinnin. Osallistujia oli useista eri maista."
        - heading: "Lopputulos"
          paragraphs:
          - "Summatiivinen käytettävyysarviointi täytti hyväksymiskriteerit ja tuki laitteen CE-merkinnän saavuttamista. Laite on nyt CE-merkitty."

sv:
  lang_name: "Svenska"
  title: "Thomas Stenius – Senior UX- och tjänstedesigner"
  description: "Thomas Stenius portfolio. Senior UX- och tjänstedesigner samt användarforskare."
  skip_link: "Hoppa till huvudinnehållet"
  nav_label: "Språkval"
  name: "Thomas Stenius"
  role: "Senior UX- och tjänstedesigner"
  intro: 
    - "<strong>9 år, 100+ kundprojekt.</strong> Jag hjälper organisationer omvandla sina mål och användarbehov till klara och tydliga designriktningar."
    - "Jag är människocentrerad, flexibel i metodologi och praktiskt inriktad med tillgänglighet och LLM-verktyg*."
  portrait_alt: "Porträtt av Thomas Stenius"
  testimonials_heading: "Vad kunder säger"
  translated_from:
