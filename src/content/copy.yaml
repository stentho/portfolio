  contact_links:
    - label: "Sähköposti"
      url: "mailto:thomasstenius@gmail.com"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/thomas-stenius"
  footer: "© 2026 Thomas Stenius"
  footer_note: "*Sivusto on rakennettu yhdessä Claude Sonnet 5.5-tekoälyavustajan kanssa. Vastasin ulkoasusta, vaatimuksista, sisällöstä ja saavutettavuuskriteereistä (WCAG 2.2); Claude tuotti koodin ja kuvitukset, jotka tarkistin ja iteroin. Sivusto on tehty Eleventyllä, YAML-sisältötiedostoilla sekä pelkällä HTML:llä ja CSS:llä, ja sijaitsee GitHub Pagesissa."
  projects:
    - title: "Lääkinnällinen laite: varhaisesta konseptista CE-merkittyyn tuotteeseen"
      glance:
        role: "UX-tutkimuksista ja arvioinneista vastaava (konsultti)"
        scope: "Vastasin käyttäjätutkimuksista ja lääkinnällisen laitteen formatiivisesta ja summatiivisesta käytettävyysarvioinnista osana CE-merkintäprosessia. Tulosten pohjalta kehitin käyttöliittymää käyttäjälähtöisemmäksi, helppokäyttöisemmäksi ja turvallisemmaksi."
        outcome: "Tutkimukseen perustuva, käyttäjälähtöisempi ja käyttöturvallisempi tuote. Dokumentoitu näyttö käytettävyyden validoinnista CE-merkintäprosessissa. Tuote on saanut CE-merkinnän."
      cover:
        file: "medtech-cover.svg"
        alt: ""
      sections:
        - heading: ""
          paragraphs:
            - "Lääkintälaitealalla potilasturvallisuus on kaikki kaikessa. Asiakkaalla oli varhaisen vaiheen konsepti lääkinnällisestä laitteesta, jonka tueksi oli jo tehty alustavaa käyttäjätutkimusta ja käyttöliittymäkonseptointia."
            - "Liityin pieneen, suunnittelijoista ja ohjelmistokehittäjistä koostuvaan tiimiin, joka työskenteli tiiviissä yhteistyössä asiakkaan tuoteomistajan kanssa. Tavoitteenamme oli kehittää varhaisesta konseptista valmis, käyttäjälähtöinen ja käyttöturvallinen lääkinnällinen tuote, joka täyttää CE-merkinnän vaatimukset."
            - "Työ eteni kolmessa vaiheessa:"
        - heading: "1. Kontekstin ymmärtäminen ja tutkimustiedon täydentäminen"
          image:
            file: "medtech-context_light.svg"
            alt: ""
          paragraphs:
            - "Aloitimme perehtymällä aiempaan käyttäjätutkimukseen ja käyttöliittymäkonseptin luonnoksiin. Syvensin ymmärrystäni lääkäreiden työstä haastattelemalla useita kokeneita lääkäreitä. Tavoitteena oli lisätä ymmärrystä lääkäreiden arjen työskentelystä, sekä tilanteista, joihin liittyy merkittäviä potilasturvallisuusriskejä."
            - "Lisäksi rakensimme julkisiin tietolähteisiin perustuvan sisäisen LLM-työkalun sparrailukumppaniksi. Kaikki potilasturvallisuuteen ja suunnitteluratkaisujen kannalta kriittiset havainnot varmistimme aina lääketieteen asiantuntijoilta."
        - heading: "2. Suunnittelu ja arviointi"
          image:
            file: "medtech-design-testing_light.svg"
            alt: ""
          paragraphs:
            - "Kollegani vastasivat varsinaisesta käyttöliittymäsuunnittelusta, mutta osallistuin tiiviisti suunnitteluprosessiin ja suunnitteluratkaisujen arviointiin. Tunnistin suunnittelun edetessä mahdollisia käytettävyysongelmia ja nostin esiin erityisesti käyttöturvallisuuteen liittyviä riskejä."
            - "Lääkinnällisten laitteiden kehityksessä poikkeukselliset käyttötilanteet ja reunatapaukset ovat erityisen tärkeitä, sillä niissä pienilläkin käytettävyysongelmilla voi olla vakavia seurauksia potilasturvallisuudelle. Suunnittelimme siksi yhdessä kollegani kanssa testiskenaarioita, jotka perustuivat tunnistettuihin vaaroihin ja niihin liittyviin käyttötilanteisiin. Varmistimme skenaarioiden realistisuuden yhteistyössä lääkäreiden kanssa."
            - "Vastasin kaikista formatiivisista käytettävyystesteistä, joiden tavoitteena oli arvioida suunnitteluratkaisuja iteratiivisesti ja tunnistaa mahdolliset käyttövirheet jo kehityksen aikana. Testien avulla pystyimme arvioimaan aiemmin tunnistettuja käyttöturvallisuusriskejä sekä tunnistamaan uusia käyttövirheitä ja mahdollisia vaaratilanteita. Havaintojen perusteella kehitimme käyttöliittymää sujuvammaksi ja turvallisemmaksi."
            - "Työtä ohjasivat lääkinnällisten laitteiden riskienhallinnan ja käytettävyyssuunnittelun standardit ISO 14971, IEC 62366-1 ja IEC/TR 62366-2."
        - heading: "3. Summatiivinen arviointi"
          image:
            file: "medtech-evaluation_light.svg"
            alt: ""
          paragraphs:
            - "Johdin CE-merkintäprosessiin kuuluvaa summatiivista käytettävyysarviointia, jonka tavoitteena oli osoittaa, että kohderyhmien käyttäjät pystyvät käyttämään lääkinnällistä laitetta turvallisesti tarkoitetuissa käyttötilanteissa."
            - "Vastasin testauksen suunnittelusta ja toteutuksesta sekä moderoin henkilökohtaisesti kaikki testi-istunnot. Arviointiin osallistui yhteensä 30 käyttäjää eri kohderyhmistä. Kukin noin 2,5 tunnin istunto sisälsi tuotteen esittelyn, haastattelun, käytännön käyttötehtäviä ja loppuarvioinnin. Osallistujia oli useista eri maista."
        - heading: "Lopputulos"
          paragraphs:
          - "Summatiivinen käytettävyysarviointi täytti hyväksymiskriteerit ja tuki laitteen CE-merkinnän saavuttamista. Laite on nyt CE-merkitty."
      # One or two images, shown top right with the text wrapping around them.
      # alt: leave empty ("") if the image is just decoration; otherwise describe it.

sv:
