    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/thomas-stenius"
  footer: "© 2026 Thomas Stenius"
  footer_note: "*Byggd tillsammans med Claude Sonnet 5.5. Jag ansvarade för layout, krav, innehåll och tillgänglighetskriterier (WCAG 2.2); Claude genererade kod och illustrationer, som jag granskade och itererade. Byggd med Eleventy, YAML-innehållsfiler och ren HTML/CSS. Hostad på GitHub Pages."
  projects:
    - title: "Medicinteknisk produkt: från tidigt koncept till CE-märkt produkt"
      glance:
        role: "Ansvarig för UX-forskning och utvärdering (konsult)"
        scope: "Användarforskning, formativ och summativ användbarhetstestning, co-design av användargränssnittet"
        outcome: "Användbarhetsutvärderingen godkänd; produkten CE-märkt"
      sections:
        - heading: ""
          paragraphs:
            - "Inom medicinteknik är patientsäkerhet allt. Kunden hade ett preliminärt produktkoncept, som byggde på inledande användarforskning och konceptbilder från tidigare arbete. Jag gick med i ett litet team designers och utvecklare och arbetade tillsammans med produktägaren för att ta konceptet från utgångsläget till ett färdigt CE-märkt system. Vi arbetade i tre faser:"
        - heading: "1. Förstå sammanhanget, komplettera med forskning"
          paragraphs:
            - "Vi började med att gå igenom den befintliga forskningen och konceptbilderna. Jag är inte läkare, så jag passade på att intervjua flera erfarna läkare för att fördjupa min förståelse för det praktiska läkararbetet och förstå var patientsäkerheten är mest hotad. För att komplettera detta byggde vi ett internt LLM-baserat verktyg med hjälp av offentliga källor som bollplank, men validerade alltid allt viktigt med riktiga läkare."
        - heading: "2. Design och utvärdering"
          paragraphs:
            - "Mina kollegor ansvarade huvudsakligen för användargränssnittet, men jag bidrog till viktiga designbeslut och lyfte fram användbarhetsproblem under processens lopp. I medicinska sammanhang är gränsfall situationer som kan skapa risker för patientsäkerheten, så tillsammans med en kollega utformade vi testscenarier som utgick från användningsrelaterade faror och konsulterade läkare för att göra scenarierna så realistiska som möjligt. Jag ledde all formativ användartestning (tidiga, iterativa tester som formar designen). Via testningen bekräftade vi tidigare antagna risker och identifierade nya möjliga faror, vilket ledde till ändringar i designen. Arbetet vägleddes också av standarderna ISO 14971, IEC 62366-1 och IEC/TR 62366-2."
        - heading: "3. Summativ utvärdering" 
          paragraphs:
            - "Jag ledde den summativa användbarhetsutvärderingen (som krävs för CE-märkning), alltså slutprovet där man testar att målgruppen kan använda produkten säkert. Jag modererade varje session personligen. 30 användare från de relevanta målgrupperna deltog i sessioner på 2,5 timmar (introduktion, intervju, praktisk testning och utvärdering). Vi hade deltagare från flera olika länder."
      outcome:
        - "Acceptanskriterierna uppfylldes och produkten är nu CE-märkt."
