  testimonials:
    - text: "Thomas oli asiantunteva ja esitti asiansa ymmärrettävästi."
      name: "Asiakas"
      title: "terveysteknologian toimiala"
      original_lang: "fi"
    - text: "Poikkeuksellinen työpanoksesi todellakin ylitti odotuksemme. Esittämäsi havainnot ovat keskeisesti vaikuttaneet suunnittelu- ja liiketoimintastrategioihimme lisäten ymmärrystämme asiakkaistamme ja heidän tarpeistaan."
      name: "Asiakas"
      title: "telekommunikaatioyritys"
      original_lang: "en"
  work_heading: "Valittuja projekteja"
  glance_labels:
    role: "Roolini"
    scope: "Työn sisältö"
    outcome: "Lopputulos"
  read_more: "Lue projektin kuvaus"
  outcome_label: "Lopputulos"
