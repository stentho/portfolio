        paragraphs:
          - "<strong>Vad jag gör:</strong> Hela processen från början till slut: research, koncept, design, utvärdering, få ihop intressenterna, tillgänglighetsgranskning. För den visuella finslipningen samarbetar jag gärna med visuella designers."
          - "<strong>Hur jag tänker:</strong> Mina designbeslut grundar sig på research. Det betyder inte att man går långsamt, utan att man <em>förstår vad man håller på med</em>:"
          - "<blockquote>Vilka är intressenterna?</blockquote>"
          - "<blockquote>Var går värdeflödena?</blockquote>" 
          - "<blockquote>Vilket värde skapar vi, och för vem?</blockquote>"
          - "<blockquote>Vilka konsekvenser, positiva och negativa, förverkligas om vi lanserar den här produkten?</blockquote>"
          - "<blockquote>Hur definierar vi – och mäter – framgång och misslyckande?</blockquote>"
          - "För att kunna svara på dessa frågor måste man prata med människor, observera dem och lyssna."
          - "<strong>Resultat, inte volym:</strong> I en värld där AI-verktyg gör det billigare och snabbare än någonsin att bygga mjukvara är det avgörande att vi inte bara skapar mera saker, utan värde. AI ger designers nya fina möjligheter att själva smutsa ner händerna, men verktyg är bara verktyg i slutändan. Jag använder de redskap som funkar: Claude Code, Figma, penna och papper. Fortfarande är det <em>klarhet</em> och <em>förståelse</em> som medför den största effekten."
      - heading: "\"Hur använder du AI?\""
        paragraphs:
          - "På många sätt! Här är tre:"
          - "<strong>Att vässa stålet:</strong> Chattbotar hjälper mig att vässa mina idéer. Jag ser det som en vidareutveckling av den s.k. \"gummiankmetoden\", där man reder ut sina tankar genom att förklara dem steg för steg till en leksaksanka. AI-chattbottar kan förstås dessutom svara tillbaka, hitta luckor i resonemanget och peka ut sådant man missat. Stål vässar stål."
          - "<strong>Djupsökning:</strong> Språkmodeller är fantastiska på att gräva sig igenom enorma datamängder och hitta sånt som traditionellt varit väldigt svårt att hitta. En tidsstämpel för ett citat ur 12 timmars intervjuinspelningar? Inga problem. En specifik fil från ett gammalt projekt? Även en vag prompt räcker."
          - "<strong>Funktionella prototyper och webbplatser:</strong> LLM:er är bra både på att skriva kod och på att förklara hur den fungerar. Som exempel har jag byggt den här nätsidan med hjälp av Claude. Jag skissade layouten för hand och definierade kraven, innehållet och tillgänglighetskriterierna (WCAG 2.2). Claude skapade baskoden och dekorationerna, som jag sedan granskade, redigerade och byggde vidare på. Därefter itererade jag antingen direkt i koden eller genom att be Claude om tips. Hela tiden hade jag koll på vad som hände, både i koden och i designen."
      - heading: "\"Okej, när använder du <em>inte</em> AI?\""
        paragraphs:
          - "<strong>Tankekrävande uppgifter:</strong> Komplex problemlösning, visionsarbete, konceptutveckling, wireframing, att avgöra vad som är viktigt. Jag tror att första utkastet till vad som helst alltid ska komma från en själv, hur skissartat det än är, för det är där ramarna sätts. Språkmodeller kan vara riktigt bra kritiker och bollplank, men det är jag som dirigerar orkestern. Det är definitivt inte så här:"
          - "<blockquote>Claude, generera ett fullt fungerande designsystem åt mig. Gör inga misstag.</blockquote>"
          - "Design är något avsiktligt, och generativa AI-modeller har ingen egen avsikt. De är kraftfulla (och ofta användbara) statistiska mönstermatchare som reagerar på prompter, men mer än så är de inte."
          - "<strong>När generativ AI är \"overkill\":</strong> Datorkraft är inte gratis, varken ekonomiskt eller miljömässigt. Om det finns ett mindre beräkningsintensivt sätt att göra något väljer jag i första hand det. För enkla uppgifter, som att sortera en tabell, är ett deterministiskt skript det klokare valet. Om jag behöver generativ AI men uppgiften inte är särskilt krävande tar jag en mindre modell."
          - "<strong>Tester i verkligheten:</strong> Att prova saker i verkligheten är det snabbaste sättet att få veta vad som faktiskt funkar. Den här webbplatsen testade jag till exempel med riktiga hjälpmedel (skärmläsare, enbart tangentbord, röststyrning) och kontrollerade den mot etablerade tillgänglighetskriterier (WCAG 2.2)."
      - heading: "\"Vad vill du göra framöver?\""
        paragraphs:
          - "Skapa tekniskt solida, ekonomiskt bärkraftiga och miljömässigt hållbara produkter och tjänster som förbättrar människors liv."
          - "<em>Teknologi</em>, <em>business</em>, <em>planet</em> och <em>människor</em> – tar man bort någon av dem fungerar inte produkten, särskilt inte på lång sikt."

