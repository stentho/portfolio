  intro: 
    - "<strong>9 vuotta, 100+ asiakasprojektia.</strong> Autan organisaatioita yhdistämään liiketoiminnan tavoitteet ja käyttäjien tarpeet toimiviksi, käyttäjälähtöisiksi palveluiksi ja ratkaisuiksi."
    - "Olen ihmiskeskeinen ja menetelmiltäni joustava - lähestymistapani käyttäjäkokemukseen, saavutettavuuteen sekä LLM-työkaluihin on käytännönläheinen."
  portrait_alt: "Etunimi Sukunimen muotokuva"
  testimonials_heading: "Mitä asiakkaat sanovat"
  translated_from:
    fi: "Käännetty suomesta"
    sv: "Käännetty ruotsista"
    en: "Käännetty englannista"
  testimonials:
    - text: "Olemme tehneet pitkään yhteistyötä ja olleet aina tyytyväisiä ammattitaitoonne ja asenteeseenne työtä ja asiakkaita kohtaan."
      name: "Asiakas"
      title: "vakuutusyhtiö"
      original_lang: "en"
    - text: "Poikkeuksellinen työpanoksesi todellakin ylitti odotuksemme. Esittämäsi havainnot ovat keskeisesti vaikuttaneet suunnittelu- ja liiketoimintastrategioihimme lisäten ymmärrystämme asiakkaistamme ja heidän tarpeistaan."
      name: "Asiakas"
      title: "telekommunikaatioyritys"
      original_lang: "en"
  about:
    heading: "\"Thomas kuka?\""
    sections:
      - heading: "\"Minkälainen suunnittelija olet?\""
        paragraphs:
          - "<strong>Mitä teen:</strong> Hoidan monipuolisesti suunnitteluprosessin eri vaiheita: tutkimus, konseptointi, suunnittelu, arviointi, sidosryhmien valjastaminen, saavutettavuustarkastukset. Ulkoasun viimeistelyn hoidan mieluiten yhdessä visuaalisen suunnittelijan kanssa."
          - "<strong>Miten ajattelen:</strong> Pohjaan suunnittelupäätökseni tutkimukseen. Se ei tarkoita, että etenisin hitaasti, vaan että suunnittelufilosofiani pohjautuu <em>ymmärrykseen siitä, mitä ollaan tekemässä</em>:"
          - "<blockquote>Keitä sidosryhmät ovat?</blockquote>"
          - "<blockquote>Miten arvovirrat liikkuvat?</blockquote>"
          - "<blockquote>Minkälaista arvoa luomme ja kenelle?</blockquote>"
          - "<blockquote>Mitä seurauksia tuotteen julkaisemisella on, hyviä ja huonoja?</blockquote>"
          - "<blockquote>Miten määrittelemme onnistumisen tai epäonnistumisen, ja miten niitä mitataan?</blockquote>"
          - "Vastaus ilmenee vain puhumalla ihmisten kanssa ja tarkkailemalla, miten he toimivat aidossa tilanteessa."
          - "<strong>Vaikutus, ei tuotos:</strong> Tekoälytyökalut ovat mahdollistaneet ohjelmistojen rakentamisen yhä nopeammin ja halvemmin. Olennaista on siis, ettei vain luoda lisää tavaraa vaan <em>arvoa</em>. Tekoäly tuo suunnittelijoille mahdollisuuden vaikuttaa monipuolisemmin tuotekehitykseen, mutta yksi perusajatus pysyy samana: työkalut ovat vain työkaluja. Käytän sitä, mikä toimii: Claude Codea, Figmaa, kynää ja paperia. Ja miksei kaikkia kolmea samaan aikaan? Aito tehokkuus syntyy joka tapauksessa siitä, kuinka hyvin <em>ymmärrämme</em> sidosryhmiämme ja kuinka selkeä kuva meillä on tavoitetilastamme."
      - heading: "\"Miten käytät tekoälyä?\""
        paragraphs:
          - "Monella tapaa! Tässä kolme:"
          - "<strong>Ajatusten terävöittäminen:</strong> Tekoälybotit toimivat hyvin ajatusten terävöittämiseen. Miellän ne seuraavaksi askeleeksi klassisesta \"kumiankkamenetelmästä\": Ajatukset järjestyvät, kun ne selittää auki vaihe kerrallaan kumiankalle. Chatbotit voivat tietysti myös vastata (toisin kuin kumiankat), löytää aukkoja argumenteissa ja muistuttaa asioista, jotka ovat voineet jäädä huomaamatta. Teräs hioo terästä ja niin edelleen."
          - "<strong>Semanttinen haku:</strong> Kielimallit ovat taitavia löytämään <q>neulan heinäsuovasta</q>. Tarkka aikaleima lainaukselle 12 tunnin haastattelutallenteista? Onnistuu hetkessä. Muistiinpanot ikivanhasta projektista? Epämääräinenkin prompti riittää."
          - "<strong>Toiminnalliset prototyypit ja verkkosivut:</strong> Koodin tuottaminen kielimallin avustuksella on pelottavan nopeaa, ja botti osaa myös selittää koodiaan taitavasti. Esimerkkinä rakensin tämän sivuston yhdessä Clauden kanssa:"
          - |
            - Hahmottelin ensin osiot piirtämällä asettelun käsin piirrustusohjelmalla. 
            - Määrittelin vaatimukset, sisällön, väripaletin ja saavutettavuuskriteerit (WCAG 2.2).
            - Claude tuotti pohjakoodin ja koristeelementit, jotka kävin tarkkaan läpi. Muokkasin ja täydensin niitä tarpeen mukaan koodieditorilla. 
            - Iteroin sivustoa lisäämällä sisältöä ja komponentteja joko suoraan koodista tai Clauden avulla. Koko ajan pysyin kärryillä siitä, mitä tapahtui sekä koodissa että käyttöliittymässä."
      - heading: "\"Okei, mihin <em>et</em> käytä tekoälyä?\""
        paragraphs:
          - "<strong>Ajattelua vaativat tehtävät:</strong> Moniulotteiset ongelmat, visiointi, konseptointi, rautalangat, päätöksenteko, priorisointi – kaikki rasittavat pollaa, hyvällä tavalla. Näissä asioissa ensimmäinen luonnos tehdään aina itse, vaikka kynällä ja paperilla, koska muuten suunnittelulle olennainen ns. <em>kehystys</em> jää helposti taka-alalle. Kielimallit ovat hyviä kriitikoita ja sparrauskumppaneita, mutta pidän tärkeänä, että ohjat pysyvät omissa käsissäni. Se ei todellakaan näytä tältä:"
          - "<blockquote>Claude, generoi minulle täysin toimiva design system. Älä tee virheitä.</blockquote>"
          - "Suunnittelu on tavoitteellista toimintaa eikä tekoälymalleilla ole omia tavoitteita. Ne ovat kyllä tehokkaita (ja usein hyödyllisiä), mutta loppupeleissä ovat promptiin reagoivia tilastollisia hahmontunnistajia."
          - "<strong>Kun pienempi tykki riittää:</strong> Laskentateho ei ole ilmaista, ei rahassa eikä ympäristön kannalta. Jos asian voi tehdä laskennallisesti kevyemmällä menetelmällä, harkitsen sitä ensin. Esimerkiksi taulukon lajittelussa perinteinen skripti voi olla viisaampi valinta. Jos kuitenkin tarvitaan generatiivista tekoälyä, mutta tehtävä ei ole erityisen monimutkainen, tartun suosiolla pienempään malliin."
          - "<strong>Testaus käytännössä:</strong> Käytännön testaus on nopein tapa selvittää, mikä aidosti toimii. Esimerkkinä testasin tämän sivuston saavutettavuutta (WCAG 2.2:n kriteerejä vasten) käyttämällä oikeita apuvälineitä (mm. ruudunlukijalla, näppäimistöllä ja puheohjauksella)."
      - heading: "\"Mitä haluat jatkossa tehdä?\""
        paragraphs:
          - "Rakentaa <em>teknisesti järkeviä</em>, <em>taloudellisesti kannattavia</em> ja <em>ympäristön kannalta kestäviä</em> tuotteita ja palveluita, jotka <em>parantavat ihmisten elämää</em>."
          - "<em>Teknologia</em>, <em>bisnes</em>, <em>planeetta</em> ja <em>ihmiset</em> — ota yksikin pois, niin tuote lakkaa toimimasta, ainakin pitkällä tähtäimellä."

