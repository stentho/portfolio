  footer_note: "*Sivusto on rakennettu yhdessä Claude Sonnet 5.5-tekoälyavustajan kanssa. Vastasin ulkoasusta, vaatimuksista, sisällöstä ja saavutettavuuskriteereistä (WCAG 2.2); Claude tuotti koodin ja kuvitukset, jotka tarkistin ja iteroin. Sivusto on tehty Eleventyllä, YAML-sisältötiedostoilla sekä pelkällä HTML:llä ja CSS:llä, ja sijaitsee GitHub Pagesissa."
  projects:
    - title: "Lääkinnällinen laite: varhaisesta konseptista CE-merkittyyn tuotteeseen"
      glance:
        role: "UX-tutkimuksen ja arviointien vetäjä (konsultti)"
        scope: "Käyttäjätutkimus, formatiivinen ja summatiivinen testaus, käyttöliittymän yhteissuunnittelu"
        outcome: "Käytettävyysarviointi läpäisty; laite CE-merkitty"
      sections:
        - heading: ""
          paragraphs:
            - "Lääkintälaitealalla potilasturvallisuus on kaikki kaikessa. Asiakkaalla oli varhainen konsepti lääkinnällisestä laitteesta, jonka pohjana oli tehty alustavaa käyttäjätutkimusta ja käyttöliittymäkonseptointia. Liityin pieneen tiimiin suunnittelijoita ja ohjelmistokehittäjiä, jossa työskenneltiin tiiviisti asiakkaan tuoteomistajan kanssa rakentaaksemme konseptista valmiin, CE-merkityn järjestelmän. Työ eteni kolmessa vaiheessa:"
        - heading: "1. Kontekstin ymmärtäminen ja aukkojen täydennys"
          paragraphs:
            - "Alkuun perehdyimme olemassa olevaan tutkimukseen ja konseptin luonnoksiin. En ole lääkäri, joten haastattelin useita kokeneita lääkäreitä saadakseni selkeämmän kuvan heidän käytännön työstään sekä tilanteista, joissa potilasturvallisuus on suurimmassa vaarassa. Täydennykseksi rakensimme julkisista lähteistä perustuvan sisäisen LLM-työkalun sparrailukumppaniksi, mutta varmistimme kaiken tärkeän aina oikeilta lääkäreiltä."
        - heading: "2. Suunnittelu ja arviointi"
          paragraphs:
            - "Kollegani vastasivat varsinaisesta käyttöliittymäsuunnittelusta, mutta olin koko ajan mukana suunnitteluprosessissa ja -päätöksissä. Suunnittelun edetessä nostin myös esille mahdollisia käytettävyysongelmia. Lääketieteellisessä yhteydessä reunatapaukset ovat erityisen huomionarvoisia tilanteita, koska niissä riski potilasturvallisuuden vaarantumiselle on merkittävä. Suunnittelimme siksi kollegani kanssa testiskenaariot vaaraan liittyviin käyttötilanteisiin pohjautuen, ja pyrimme tekemään niistä mahdollisimman realistisia yhteistyössä lääkäreiden kanssa. Vedin tässä vaiheessa kaikki formatiiviset testaukset (varhaiset, iteratiiviset testit, jotka muovaavat suunnittelua). Testien avulla pystyimme vahvistamaan aiemmin esitettyjä riskihypoteeseja sekä tunnistamaan uusia mahdollisia vaaratilanteita. Havaintojen perusteella teimme muutoksia käyttöliittymään. Työtä ohjasivat standardit ISO 14971, IEC 62366-1 ja IEC/TR 62366-2."
        - heading: "3. Summatiivinen arviointi"
          paragraphs:
            - "Johdin CE-merkintää varten vaaditun summatiivisen testauksen (loppukokeen, jossa testataan, voiko kohderyhmä käyttää laitetta turvallisesti), ja ohjasin jokaisen istunnon itse. Kolmekymmentä käyttäjää eri kohderyhmistä osallistui 2,5 tunnin istuntoihin (tuote-esittely, haastattelu, käytännön testaus ja arviointi). Osallistujia oli useista eri maista."
      outcome:
        - "Arviointi täytti hyväksymiskriteerit, ja laite on nyt CE-merkitty."
