  footer: "© 2026 Thomas Stenius"
  footer_note: "Co-developed with Claude Sonnet 5.5. I led the layout, requirements, content, and accessibility criteria (WCAG 2.2); Claude generated code and illustrations, which I reviewed and iterated on. Built with Eleventy, YAML content files and plain HTML/CSS, hosted on GitHub Pages."
  projects:
    - title: "Medical device: from early concept to CE-marked product"
      # "At a glance": three short lines shown under the title
      glance:
        - label: "My role"
          value: "I was a senior UX consultant part of a larger team. Among other responsibilities, I led the user research and formative and summative usability evaluation of the device as part of the CE marking process. Based on the findings, I helped make the UI more user-friendly and safer to use."
        - label: "Outcome"
          value: "A user-friendlier, safer device backed by research; documented usability validation for CE marking; device is now CE marked."
      # Any number of sections, each with a heading and one or more paragraphs
      cover:
        file: "medtech-cover.svg"
        alt: ""
      sections:
        - heading: ""
          paragraphs:
            - "In medtech, patient safety is everything. A client had an early-stage device concept, backed by initial user research and mockups from earlier work."
            - "I joined a small team of designers and developers working closely with the client’s product owner. Our goal was to turn the early concept into a finished, user-centered and safe-to-use medical product that meets CE marking requirements."
            - "We worked in <em>three phases</em>:"
        - heading: "1. Understand the context, fill the research gaps"
          image:
            file: "medtech-context_light.svg"
            alt: ""
          paragraphs:
            - "We started by reviewing the existing user research and mockups. To deepen my understanding of physicians’ work, I interviewed several experienced doctors about their daily practice and the situations where patient safety is most at risk."
            - "To supplement this, we built an internal LLM-based tool from public sources as a sounding board. Any findings critical to patient safety or design decisions were always validated with medical experts."
        - heading: "2. Design and evaluate"
          image:
            file: "medtech-design-testing_light.svg"
            alt: ""
          paragraphs:
            - "I was closely involved in the user interface design process and in evaluating design solutions. As the design evolved, I identified potential usability issues and raised, in particular, those related to safe use."
            - "In medtech, unusual use situations and edge cases matter a lot, because even small usability problems can have serious consequences for patient safety. So, with a colleague, I designed test scenarios based on identified hazards and the related use situations, and worked with physicians to ensure they were realistic."
            - "I ran all the formative testing: iterative user tests to evaluate the designs and identify possible use errors in the development stage. These tests confirmed previously found risks and identified new hazards. Based on the findings we made, design changes to improve usability and use safety."
            - "The work was guided by medical device risk management and usability standards ISO 14971, IEC 62366-1 and IEC/TR 62366-2."
        - heading: "3. Summative evaluation"
          image:
            file: "medtech-evaluation_light.svg"
            alt: ""
          paragraphs:
            - "I led the summative usability evaluation required for CE marking: the final test showing that the device can be used safely by its intended users."
            - "I was closely involved in the planning of the tests and moderated each session personally. A total of 30 target users across the relevant user groups took part in 2.5-hour sessions (briefing, interview, hands-on testing and evaluation). Participants came from many different countries."
        - heading: "Outcome"
          paragraphs:
          - "The summative evaluation passed its acceptance criteria, supporting the CE-marking of the device. The product is now CE marked."
    - title: "Teleoperator: ongoing UX partnership with 30+ projects"
      cover:
        file: "case-cover.svg"
        alt: ""
      intro:
        paragraphs:
          - "<strong>6 years and 30+ projects, informing product, design, accessibility, and compliance decisions to improve customer experience.</strong>"
          - "Each project started by working with the client’s designers and product people to shape the scope and strategy of the research, and ended with taking recommendations to the decision-makers."
          - "Three projects to demonstrate the breadth of my work:"
      subcases:
        - title: "1. Entertainment box setup: fixing a frustrating first experience"
          teaser: "Findings shaped plans to redesign the setup process for hundreds of thousands of customers."
          cover:
            file: "setup-cover.svg"
            alt: ""
          sections:
            - heading: "Challenge"
              quote:
                text: "I'm very satisfied with the UX work that Thomas did for our service . . . I'm especially happy that the recommendations also included alternative ways to ease the customer's experience, so that we could implement as many improvements despite technical limitations. From the beginning, Thomas wanted to understand our problem space, and goals of the research, and the project met its goals brilliantly."
                name: "Client"
                title: "Business Development Manager"
                original_lang: "fi"
              image:
                file: "setup-challenge.svg"
                alt: ""
              paragraphs:
              - "Customer satisfaction surveys had revealed negative feedback about setting up the client’s entertainment box. The client wanted evidence on the pain points to prioritize redesigns. I led the research and design recommendations, scoping them with the client’s designers and business development manager."
            - heading: "Approach and findings"
              image:
                file: "setup-findings.svg"
                alt: ""
              paragraphs:
                - "I observed 6 target-audience participants unbox and set up a real production box with a real TV, which exposed problems a prototype would have missed. The process was fine overall, but each issue led to a recommendation shaped by the client’s technical constraints:"
                - |
                  - <strong>Batteries were tricky to find and insert</strong> → preinstall them in the remote.
                  - <strong>Software setup was long and fatiguing</strong> → streamline where possible, add progress indicators where not.
                  - <strong>Multiple search systems were confusing</strong> → one search across the product.
            - heading: "Impact"
              image:
                file: "setup-impact.svg"
                alt: ""
              paragraphs:
               - "I presented to product leadership and worked with the teams to check feasibility and align on priorities. The team planned a redesign of the setup process, with workarounds for technically constrained issues. Implementation details are confidential."
        - title: "2. Travel and roaming: redirecting a product decision"
          teaser: "Research stopped a product that wouldn’t have met customer needs, saving tens of thousands of euros."
          cover:
            file: "roaming-cover.svg"
            alt: ""
          sections:
            - heading: "Challenge"
              quote:
                text: "A special thanks goes out to Thomas, whose expertise and dedication to the roaming research process have been remarkable. His ability to uncover critical user insights and communicate them effectively has made a significant impact on our work."
                name: "Client"
                title: "Digital Experience Lead"
                original_lang: "en"
              image:
                file: "roaming-challenge.svg"
                alt: ""
              paragraphs:
              - "The client wanted to grow its traveler segment and lift the low usage of its roaming lineup. I led the customer insights effort, scoping it with the digital experience lead."
            - heading: "Approach and findings"
              image:
                file: "roaming-findings.svg"
                alt: ""
              paragraphs:
              - "I interviewed 8 frequent travelers and tested new roaming product concepts with them. Each finding led to a recommendation:"
              - |
                - <strong>Travelers avoided roaming because of its history of high prices, preferring WiFi or prepaid SIMs</strong> → raise awareness of existing travel data packages as a distinct alternative that fits the “travel SIM” niche and sidesteps pay-as-you-go’s bad connotations.
                - <strong>They couldn’t understand the welcome SMS options or gauge their data needs</strong> → explain amounts with concrete examples and make usage easy to track via SMS.
                - <strong>Larger packages were consistently preferred; pay-as-you-go was seen as for emergencies</strong> → emphasize the larger packages in the current lineup. They have a different cost and margin profile, but I argued the customer utility made up for it.
            - heading: "Impact"
              image:
                file: "roaming-impact.svg"
                alt: ""
              paragraphs:
               - "I presented to product leadership and worked with the team to align on priorities. Based on my findings, a proposed new product was never developed, as it would not have satisfied the customer need, saving an estimated tens of thousands of euros. Instead, raising awareness of existing products was prioritized."
        - title: "3. Accessibility improvements to the communication platform"
          teaser: "A re-evaluation a year later confirmed that most flagged issues had been fixed."
          cover:
            file: "a11y-cover.svg"
            alt: ""
          sections:
            - heading: "Challenge"
              quote:
                text: "Very nice job, Thomas . . . Good findings, good details, well executed."
                name: "Client"
                title: "Developer"
                original_lang: "en"
              image:
                file: "a11y-challenge.svg"
                alt: ""
              paragraphs:
              - "The client wanted to know how accessible their customer communication platform was, mainly for compliance reasons. I led the evaluation, scoping it with the development team, and assessed the service against WCAG 2.2 and the European Accessibility Act."
            - heading: "Approach and findings"
              image:
                file: "a11y-findings.svg"
                alt: ""
              paragraphs:
              - "I evaluated the service on a Windows laptop with the NVDA screen reader and keyboard-only navigation. Issues included:"
              - |
                - Files couldn’t be attached by keyboard, and some other functions were also unreachable.
                - Focus indicators were missing, and many components lacked programmatic labels.
                - The focus order was confusing in places.
            - heading: "Impact"
              image:
                file: "a11y-impact.svg"
                alt: ""
              paragraphs:
              - "I presented the findings to the product owners and development team, and we prioritized issues by severity (1-4, set by me) and estimated effort to fix. A year later, I proposed a re-evaluation, which the client agreed to, and this time I also tested on iOS with VoiceOver. Most flagged issues had been fixed. Some remained and new ones had appeared, from the added iOS coverage, from barriers the earlier ones had masked, and from new features. Overall accessibility had improved substantially."
      synthesis:
        heading: "Overall takeaway"
        paragraphs:
          - "I’ve worked with product, design, development and leadership teams to understand customers, remove friction, and make services more usable and accessible."
          - "My approach stays the same across very different projects:"
          - |
            - <strong>Workshop the scope with the client.</strong> The most important part of any project is defining the goals and research questions, and understanding how the results will be used.
            - <strong>Test in realistic conditions.</strong> Realistic scenarios, real target-audience users, and real assistive technology, so the findings hold up in practice.
            - <strong>Make recommendations that can be built, then follow through.</strong> I weigh user insight against technical and business constraints, agree on priorities with the teams, and check that fixes held, as with the accessibility re-evaluation I proposed.
