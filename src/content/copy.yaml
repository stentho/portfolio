en:
  lang_name: "English"
  title: "Thomas Stenius – Senior UX & Service Designer"
  description: "Portfolio of Thomas Stenius, a senior UX and service designer and user researcher."
  skip_link: "Skip to main content"
  nav_label: "Language"
  name: "Thomas Stenius"
  role: "Senior UX & Service Designer"
  intro: 
    - "9 years, 100+ client projects. Helping organizations turn business goals and user needs into clear design decisions."
    - "People-centered, method-flexible, and hands-on with accessibility and LLM tools*."
  portrait_alt: "Portrait of Thomas Stenius"
  testimonials_heading: "What clients say"
  translated_from:
    fi: "Translated from Finnish"
    sv: "Translated from Swedish"
    en: "Translated from English"
  # Quotes about you overall. original_lang = the language the person said it in.
  testimonials:
    - text: "Thomas was well-informed and presented his ideas clearly."
      name: "Client"
      title: "Healthcare IT industry"
      original_lang: "fi"
    - text: "Your exceptional work has truly exceeded our expectations. The insights you delivered have been instrumental in shaping our design and business strategies, providing us with a clearer understanding of our customers and their needs."
      name: "Client"
      title: "Telecommunications company"
      original_lang: "en"
  work_heading: "Selected work"
  glance_labels:
    role: "My role"
    scope: "Scope"
    outcome: "Outcome"
  outcome_label: "Outcome"
  contact_heading: "Contact me"
  contact_text: "I'd love to hear from you."
  contact_links:
    - label: "Email"
      url: "mailto:thomasstenius@gmail.com"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/thomas-stenius"
  footer: "© 2026 Thomas Stenius"
  footer_note: "*Co-developed with Claude Sonnet 5.5. I led the layout, requirements, content, and accessibility criteria (WCAG 2.2); Claude generated code and illustrations, which I reviewed and iterated on. Built with Eleventy, YAML content files and plain HTML/CSS, hosted on GitHub Pages."
  projects:
    - title: "Medical device: from early concept to CE-marked product"
      # "At a glance": three short lines shown under the title
      glance:
        role: "UX research and evaluation lead (consultant)"
        scope: "User research, formative testing, summative usability evaluation, UI co-design"
        outcome: "Usability evaluation passed; device CE marked"
      # Any number of sections, each with a heading and one or more paragraphs
      sections:
        - heading: ""
          paragraphs:
            - "In MedTech, patient safety is everything. A client had an early device concept, backed by initial user research and mockups from earlier work. I joined a small team of designers and developers, working closely with the client’s product owner and staff, to take it from that starting point to a finished, CE-marked system. We worked in three phases:"
        - heading: "1. Understand the context, fill the gaps"
          paragraphs:
            - "We started by reviewing the existing research and mockups. I’m not a physician, so I interviewed several experienced doctors to deepen my understanding of the work in practice and of where patient safety is most at risk. To supplement this, we built an internal LLM-based tool from public sources as a sounding board for quick exploration, though always validating anything important with real doctors."
        - heading: "2. Design and evaluate"
          paragraphs:
            - "My designer colleagues led the interface and flow design. I contributed to important design decisions and flagged usability issues as the design evolved. In medical contexts, edge cases are where patient safety can be compromised, so with a colleague, I designed test scenarios around use-related hazards, built with physicians to be as realistic as possible. I ran all the formative testing (early, iterative tests that shape the design). It confirmed risks hypothesized earlier in the project, identified new hazards, and led us to change the design to address them. The work was guided by ISO 14971, IEC 62366-1 and IEC/TR 62366-2."
        - heading: "3. Summative evaluation"
          paragraphs:
            - "I led the summative usability evaluation required for CE marking: the final test showing that the device can be used safely by its intended users. I moderated every session personally. Thirty target users across the relevant user groups took part in 2.5-hour sessions (briefing, interview, hands-on testing and evaluation). We had participants from many different countries."
      # Shown under the heading set in outcome_label above
      outcome:
        - "The evaluation met its acceptance criteria, and the device is now CE marked."
      # Optional project quote: delete the whole "quote" block if there is none.
      # One or two images, shown top right with the text wrapping around them.
      # alt: leave empty ("") if the image is just decoration; otherwise describe it.
      images:
        - file: "medtech-context.svg"
          alt: ""
        - file: "medtech-design-testing.svg"
          alt: ""
        - file: "medtech-evaluation.svg"
          alt: ""

