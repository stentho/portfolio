en:
  lang_name: "English"
  title: "Thomas Stenius – Senior UX & Service Designer"
  description: "Portfolio of Thomas Stenius, a senior UX and service designer and user researcher."
  skip_link: "Skip to main content"
  nav_label: "Language"
  name: "Thomas Stenius"
  role: "Senior UX & Service Designer"
  intro: 
    - "9 years, 100+ client projects. Helping organizations turn business goals and user needs into clear design decisions."
    - "People-centered, method-flexible, and hands-on with accessibility and LLM tools*."
  portrait_alt: "Portrait of Thomas Stenius"
  testimonials_heading: "What clients say"
  translated_from:
    fi: "Translated from Finnish"
    sv: "Translated from Swedish"
    en: "Translated from English"
  # Quotes about you overall. original_lang = the language the person said it in.
  testimonials:
    - text: "Thomas was well-informed and presented his ideas clearly."
      name: "Client"
      title: "healthcare IT industry"
      original_lang: "fi"
    - text: "Your exceptional work has truly exceeded our expectations. The insights you delivered have been instrumental in shaping our design and business strategies, providing us with a clearer understanding of our customers and their needs."
      name: "Client"
      title: "telecommunications company"
      original_lang: "en"
  work_heading: "Selected work"
  glance_labels:
    role: "My role"
    scope: "Scope"
    outcome: "Outcome"
  outcome_label: "Outcome"
  contact_heading: "Contact me"
  contact_text: "I'd love to hear from you."
  contact_links:
    - label: "Email"
      url: "mailto:thomasstenius@gmail.com"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/thomas-stenius"
  footer: "© 2026 Thomas Stenius"
  footer_note: "*Co-developed with Claude Sonnet 5.5. I led the layout, requirements, content, and accessibility criteria (WCAG 2.2); Claude generated code and illustrations, which I reviewed and iterated on. Built with Eleventy, YAML content files and plain HTML/CSS, hosted on GitHub Pages."
  projects:
    - title: "Medical device: from early concept to CE-marked product"
      # "At a glance": three short lines shown under the title
      glance:
        role: "UX research and evaluation lead (consultant)"
        scope: "I was responsible for the user research and formative and summative usability evaluation of the device as part of the CE marking process. Based on the findings, I helped make the UI more user-friendly and safer to use."
        outcome: "A user-friendlier, safer device backed by research; documented usability validation for CE marking; device CE marked."
      # Any number of sections, each with a heading and one or more paragraphs
      sections:
        - heading: ""
          paragraphs:
            - "In medtech, patient safety is everything. A client had an early-stage device concept, backed by initial user research and mockups from earlier work."
            - "I joined a small team of designers and developers working closely with the client’s product owner. Our goal was to turn the early concept into a finished, user-centered and safe-to-use medical product that meets CE marking requirements."
            - "We worked in three phases:"
        - heading: "1. Understand the context, fill the research gaps"
          paragraphs:
            - "We started by reviewing the existing user research and mockups. To deepen my understanding of physicians’ work, I interviewed several experienced doctors about their daily practice and the situations where patient safety is most at risk."
            - "To supplement this, we built an internal LLM-based tool from public sources as a sounding board. Any findings critical to patient safety or design decisions were always validated with medical experts."
        - heading: "2. Design and evaluate"
          paragraphs:
            - "My colleagues led the interface design, but I was closely involved in the design process and in evaluating design solutions. As the design evolved, I identified potential usability issues and raised, in particular, those related to safe use."
            - "In medtech, unusual use situations and edge cases matter a lot, because even small usability problems can have serious consequences for patient safety. So, with a colleague, I designed test scenarios based on identified hazards and the related use situations, and worked with physicians to ensure they were realistic."
            - "I ran all the formative testing: iterative user tests to evaluate the designs and identify possible use errors in the development stage. These tests confirmed previously hypothesized risks and identified new hazards. Based on the findings we made, design changes to improve usability and use safety."
            - "The work was guided by medical device risk management and usability standards ISO 14971, IEC 62366-1 and IEC/TR 62366-2."
        - heading: "3. Summative evaluation"
          paragraphs:
            - "I led the summative usability evaluation required for CE marking: the final test showing that the device can be used safely by its intended users."
            - "I was closely involved in the planning of the tests and moderated each session personally. A total of 30 target users across the relevant user groups took part in 2.5-hour sessions (briefing, interview, hands-on testing and evaluation). Participants came from many different countries."
      # Shown under the heading set in outcome_label above
      outcome:
        - "The summative evaluation passed its acceptance criteria, and the device is now CE marked."
      # Optional project quote: delete the whole "quote" block if there is none.
      # One or two images, shown top right with the text wrapping around them.
      # alt: leave empty ("") if the image is just decoration; otherwise describe it.
      images:
        - file: "medtech-context.svg"
          alt: ""
        - file: "medtech-design-testing.svg"
          alt: ""
        - file: "medtech-evaluation.svg"
          alt: ""

fi:
