<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <rect width="480" height="320" fill="#F8F2E9"/>
  <line x1="30" y1="252" x2="450" y2="252" stroke="#CDB8A0" stroke-width="4" stroke-linecap="round"/>

  <!-- 1. concept: dashed outline -->
  <rect x="40" y="120" width="80" height="120" rx="14" fill="none" stroke="#6A3F2C" stroke-width="4" stroke-dasharray="8 8"/>
  <rect x="52" y="136" width="56" height="40" rx="6" fill="none" stroke="#CDB8A0" stroke-width="4" stroke-dasharray="6 6"/>
  <circle cx="68" cy="204" r="6" fill="none" stroke="#CDB8A0" stroke-width="3"/>
  <circle cx="92" cy="204" r="6" fill="none" stroke="#CDB8A0" stroke-width="3"/>

  <path d="M128 176 h40 m-10 -8 l10 8 l-10 8" fill="none" stroke="#6A3F2C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2. prototype: tested and iterated -->
  <rect x="176" y="95" width="96" height="145" rx="16" fill="#FFFCF7" stroke="#6A3F2C" stroke-width="4"/>
  <rect x="188" y="111" width="72" height="56" rx="8" fill="#DADDE0"/>
  <polyline points="196,152 212,138 226,146 250,124" fill="none" stroke="#6A3F2C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="200" cy="190" r="6" fill="#CDB8A0"/>
  <circle cx="224" cy="190" r="6" fill="#CDB8A0"/>
  <circle cx="248" cy="190" r="6" fill="#CDB8A0"/>
  <rect x="188" y="210" width="72" height="10" rx="5" fill="#CDB8A0"/>

  <path d="M280 176 h40 m-10 -8 l10 8 l-10 8" fill="none" stroke="#6A3F2C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. finished device -->
  <rect x="328" y="70" width="112" height="170" rx="18" fill="#FFFCF7" stroke="#6A3F2C" stroke-width="5"/>
  <rect x="342" y="90" width="84" height="68" rx="10" fill="#DADDE0"/>
  <polyline points="352,142 370,124 386,134 414,106" fill="none" stroke="#6A3F2C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="358" cy="188" r="7" fill="#CDB8A0"/>
  <circle cx="384" cy="188" r="7" fill="#CDB8A0"/>
  <circle cx="410" cy="188" r="7" fill="#CDB8A0"/>
  <rect x="342" y="208" width="84" height="12" rx="6" fill="#CDB8A0"/>

  <!-- approved badge -->
  <circle cx="436" cy="76" r="27" fill="#6A3F2C" stroke="#F8F2E9" stroke-width="5"/>
  <polyline points="424,77 433,87 449,66" fill="none" stroke="#FFFCF7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- progress track -->
  <line x1="80" y1="288" x2="384" y2="288" stroke="#6A3F2C" stroke-width="4" stroke-linecap="round"/>
  <circle cx="80" cy="288" r="9" fill="#F8F2E9" stroke="#6A3F2C" stroke-width="4"/>
  <circle cx="224" cy="288" r="9" fill="#FFFCF7" stroke="#6A3F2C" stroke-width="4"/>
  <circle cx="384" cy="288" r="9" fill="#6A3F2C"/>
</svg>
